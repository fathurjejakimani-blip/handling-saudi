<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Handling - Jejak Imani</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        
        /* Welcome Screen Aesthetic */
        #welcome-screen {
            background: #ffffff;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .reveal-content { animation: revealContent 1.5s ease-out forwards; }
        @keyframes revealContent {
            0% { opacity: 0; transform: scale(0.95); filter: blur(8px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        /* Sidebar Styling */
        .sidebar-item { transition: all 0.2s ease; color: #64748b; font-weight: 500; }
        .sidebar-item.active { background-color: #ecfdf5; color: #059669; font-weight: 700; border-right: 4px solid #059669; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">

    <!-- WELCOME SCREEN -->
    <div id="welcome-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center">
        <div class="reveal-content text-center">
            <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="w-32 mb-4 mx-auto">
            <div class="h-1 w-24 bg-emerald-100 mx-auto rounded-full overflow-hidden">
                <div class="h-full bg-emerald-600 animate-[progress_2s_ease-in-out_infinite]"></div>
            </div>
            <p class="text-[10px] tracking-[0.4em] font-bold text-emerald-800 uppercase mt-4">Haji Khusus 2026</p>
        </div>
    </div>
    <style> @keyframes progress { 0% { width: 0%; } 50% { width: 100%; } 100% { width: 0%; } } </style>

    <div id="main-app" class="hidden flex min-h-screen">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white shadow-2xl transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out border-r border-slate-100">
            <div class="flex flex-col h-full">
                <!-- Header Sidebar & CLOSE BUTTON (Mobile) -->
                <div class="p-8 flex justify-between items-center">
                    <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="w-24">
                    <button onclick="toggleSidebar()" class="lg:hidden w-10 h-10 flex items-center justify-center rounded-full bg-slate-50 text-slate-400">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>

                <nav class="flex-1 p-4 space-y-2">
                    <button onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-item active w-full flex items-center gap-4 px-4 py-4 rounded-xl text-sm">
                        <i class="fa-solid fa-grid-2 w-5"></i> Dashboard
                    </button>
                    <button onclick="showPage('itinerary')" id="btn-itinerary" class="sidebar-item w-full flex items-center gap-4 px-4 py-4 rounded-xl text-sm">
                        <i class="fa-solid fa-route w-5"></i> Itinerary
                    </button>
                    <button onclick="showPage('roomlist')" id="btn-roomlist" class="sidebar-item w-full flex items-center gap-4 px-4 py-4 rounded-xl text-sm">
                        <i class="fa-solid fa-hotel w-5"></i> Roomlist
                    </button>
                    <button onclick="showPage('pesanan')" id="btn-pesanan" class="sidebar-item w-full flex items-center gap-4 px-4 py-4 rounded-xl text-sm">
                        <i class="fa-solid fa-bell-concierge w-5"></i> Pesanan
                    </button>
                    <button onclick="showPage('jamaah')" id="btn-jamaah" class="sidebar-item w-full flex items-center gap-4 px-4 py-4 rounded-xl text-sm">
                        <i class="fa-solid fa-user-group w-5"></i> Data Jamaah
                    </button>
                </nav>
            </div>
        </aside>

        <!-- MAIN AREA -->
        <main class="flex-1 min-w-0 flex flex-col">
            <header class="h-20 flex items-center justify-between px-6 bg-white border-b border-slate-100 sticky top-0 z-40">
                <div class="flex items-center gap-4">
                    <button id="hamburger" onclick="toggleSidebar()" class="w-10 h-10 flex lg:hidden items-center justify-center rounded-xl bg-emerald-50 text-emerald-700">
                        <i class="fa-solid fa-bars-staggered"></i>
                    </button>
                    <h2 id="page-title" class="text-sm font-bold text-slate-800 uppercase tracking-widest">Dashboard</h2>
                </div>
                <div id="sync-loader" class="hidden animate-spin text-emerald-600"><i class="fa-solid fa-spinner"></i></div>
            </header>

            <div id="content-render" class="p-4 md:p-8 max-w-6xl mx-auto w-full transition-all duration-500">
                <!-- Content goes here -->
            </div>
        </main>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw3t4ld9deKYGr7OANyiinlCDR9WJqjaQ5NIrxUy7D2faUS8IGBdXlkRhW5E-LtQ_8e/exec';
        let currentData = {};

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('welcome-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('welcome-screen').style.display = 'none';
                    document.getElementById('main-app').classList.remove('hidden');
                    showPage('dashboard');
                }, 800);
            }, 2000);
        };

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        async function showPage(page) {
            const container = document.getElementById('content-render');
            const loader = document.getElementById('sync-loader');
            
            document.getElementById('page-title').innerText = page;
            loader.classList.remove('hidden');
            
            // UI Active Menu
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`btn-${page}`).classList.add('active');

            try {
                const action = 'get' + page.charAt(0).toUpperCase() + page.slice(1);
                const response = await fetch(`${SCRIPT_URL}?action=${action}`);
                const data = await response.json();
                
                if (page === 'dashboard') renderDashboard(data);
                else if (page === 'itinerary') renderItinerary(data);
                else if (page === 'roomlist') renderRoomlist(data);
                else if (page === 'pesanan') renderPesanan(data);
                else if (page === 'jamaah') renderJamaah(data);

            } catch (err) {
                container.innerHTML = `<div class="p-10 text-center text-slate-400"><i class="fa-solid fa-circle-exclamation text-3xl mb-2"></i><p>Gagal memuat data dari Sheet. Pastikan URL Script benar.</p></div>`;
            } finally {
                loader.classList.add('hidden');
                if (window.innerWidth < 1024 && !document.getElementById('sidebar').classList.contains('-translate-x-full')) {
                    toggleSidebar();
                }
            }
        }

        function renderDashboard(data) {
            const saudi = new Date(new Date().getTime() - (4 * 60 * 60 * 1000));
            document.getElementById('content-render').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="bg-emerald-900 p-8 rounded-[2rem] text-white shadow-xl shadow-emerald-200 relative overflow-hidden">
                        <i class="fa-solid fa-mosque absolute -right-4 -bottom-4 text-9xl opacity-10"></i>
                        <p class="text-xs font-bold text-emerald-300 uppercase tracking-widest mb-2">Saudi Arabia Time</p>
                        <h2 class="text-4xl font-bold">${saudi.getHours().toString().padStart(2,'0')}:${saudi.getMinutes().toString().padStart(2,'0')}</h2>
                        <p class="mt-4 text-sm opacity-70 italic font-medium">"Semoga menjadi haji mabrur"</p>
                    </div>
                    <div class="glass-card p-8 rounded-[2rem] flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Pesanan Aktif</p>
                            <h2 class="text-3xl font-bold text-slate-800">${data.pesananCount || 0}</h2>
                        </div>
                        <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl">
                            <i class="fa-solid fa-concierge-bell"></i>
                        </div>
                    </div>
                </div>
                <div class="glass-card p-6 rounded-[2rem]">
                    <h3 class="font-bold text-slate-800 mb-4 px-2 italic">Agenda Terdekat</h3>
                    <div class="space-y-3">
                        ${data.itinerary.slice(0,3).map(i => `
                            <div class="flex items-center gap-4 p-4 hover:bg-slate-50 rounded-2xl transition-all">
                                <span class="bg-emerald-100 text-emerald-700 font-bold px-3 py-1 rounded-lg text-xs">${i.waktu_saudi}</span>
                                <p class="text-sm font-semibold text-slate-700">${i.kegiatan}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderItinerary(data) {
            document.getElementById('content-render').innerHTML = `
                <div class="glass-card rounded-[2rem] overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-400 font-bold uppercase text-[10px] tracking-widest">
                            <tr><th class="px-6 py-4">Waktu KSA</th><th class="px-6 py-4">Waktu WIB</th><th class="px-6 py-4">Kegiatan</th></tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${data.map(i => `<tr class="hover:bg-emerald-50/30 transition-colors"><td class="px-6 py-4 font-bold text-emerald-700">${i.waktu_saudi}</td><td class="px-6 py-4 text-slate-400 font-medium">${i.waktu_wib}</td><td class="px-6 py-4 font-bold text-slate-700">${i.kegiatan}</td></tr>`).join('')}
                        </tbody>
                    </table>
                </div>`;
        }

        function renderRoomlist(data) {
            document.getElementById('content-render').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${data.map(r => `
                        <div class="glass-card p-5 rounded-2xl border-b-4 border-emerald-500">
                            <div class="flex justify-between items-start mb-3">
                                <span class="bg-slate-100 text-slate-500 font-bold px-2 py-1 rounded text-[10px]">ROOM #${r.no_roomlist}</span>
                                <span class="text-emerald-600 font-bold text-sm">KM ${r.no_kamar}</span>
                            </div>
                            <h4 class="font-bold text-slate-800 mb-1">${r.nama_lengkap || 'Belum Terisi'}</h4>
                            <p class="text-xs text-slate-400 font-medium tracking-tight">${r.kategori_hotel} - ${r.tipe_kamar}</p>
                        </div>
                    `).join('')}
                </div>`;
        }

        function renderPesanan(data) {
            document.getElementById('content-render').innerHTML = `
                <div class="space-y-4">
                    ${data.length === 0 ? `<div class="text-center p-20 text-slate-300">Kosong</div>` : data.map(p => `
                        <div class="glass-card p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-box"></i></div>
                                <div>
                                    <h4 class="font-bold text-slate-800">Kamar ${p.no_kamar} - ${p.nama_barang}</h4>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${p.waktu_order}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="px-3 py-1 bg-amber-100 text-amber-700 text-[10px] font-bold rounded-lg">${p.status_pesanan}</span>
                                <button onclick="updateStatus('${p.id}', 'Selesai')" class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center hover:bg-emerald-700 shadow-lg shadow-emerald-100">
                                    <i class="fa-solid fa-check"></i>
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>`;
        }

        function renderJamaah(data) {
            document.getElementById('content-render').innerHTML = `
                <div class="glass-card rounded-[2rem] overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-slate-400 font-bold uppercase text-[10px] tracking-widest">
                                <tr><th class="px-6 py-4">Nama Lengkap</th><th class="px-6 py-4">Paspor</th><th class="px-6 py-4">Paket</th></tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${data.map(j => `<tr class="hover:bg-slate-50 transition-colors"><td class="px-6 py-4 font-bold text-slate-700">${j.nama_lengkap}</td><td class="px-6 py-4 font-mono text-slate-400">${j.no_paspor}</td><td class="px-6 py-4"><span class="bg-emerald-50 text-emerald-700 px-2 py-1 rounded text-[10px] font-bold uppercase">${j.paket_haji}</span></td></tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
        }

        async function updateStatus(id, status) {
            document.getElementById('sync-loader').classList.remove('hidden');
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: new URLSearchParams({ action: 'updateStatusPesanan', id: id, status: status })
                });
                showPage('pesanan');
            } catch(e) { alert('Gagal memperbarui status'); }
        }
    </script>
</body>
</html>
