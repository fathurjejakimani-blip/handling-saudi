<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Handling Haji 2026 - Jejak Imani</title>
    
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700&family=Martel:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --ji-primary: #0f172a;
            --ji-accent: #059669;
            --ji-gold: #d4af37;
        }

        body { 
            font-family: 'Mulish', sans-serif; 
            background: url('https://lh3.googleusercontent.com/d/1S04aXsEdKJ1qAKSNnDNwkzQU5drK2MlP') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            overflow-x: hidden;
        }

        h1, h2, h3, .font-martel { font-family: 'Martel', serif; }

        /* WELCOME SCREEN */
        #welcome-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease-out;
        }
        
        .logo-anim {
            width: 200px;
            animation: pulse-logo 2s infinite ease-in-out;
        }

        @keyframes pulse-logo {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        /* SIDEBAR CUSTOM */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
            z-index: 50;
        }
        
        .sidebar.closed { transform: translateX(-100%); }
        
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            margin: 4px 12px;
            border-radius: 12px;
            color: var(--ji-primary);
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background: #f1f5f9;
            color: var(--ji-accent);
        }

        /* GLASS CARD */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* UTILS */
        .loading-overlay {
            position: fixed;
            top: 20px;
            right: 20px;
            display: none;
            background: white;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        @keyframes slide-up {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slide-up 0.3s ease-out;
        }
    </style>
</head>
<body>

    <!-- 1. WELCOME SCREEN -->
    <div id="welcome-screen">
        <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="logo-anim" alt="Logo Jejak Imani">
        <p class="mt-4 font-martel font-bold text-slate-800 tracking-widest uppercase text-sm">Sistem Handling Haji 2026</p>
    </div>

    <!-- 2. LOADING INDICATOR -->
    <div id="loading" class="loading-overlay z-[100] items-center gap-2 flex">
        <i class="fas fa-spinner fa-spin text-emerald-600"></i>
        <span class="text-xs font-bold text-slate-600">Sinkronisasi...</span>
    </div>

    <!-- 3. SIDEBAR -->
    <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 shadow-2xl border-r">
        <div class="p-6 flex justify-between items-center border-b">
            <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="w-24">
            <button onclick="toggleSidebar()" class="lg:hidden text-slate-400"><i class="fas fa-times-circle text-2xl"></i></button>
        </div>
        <nav class="mt-6 space-y-1">
            <div onclick="navTo('dashboard')" id="nav-dashboard" class="sidebar-item active"><i class="fas fa-th-large w-6"></i> Dashboard</div>
            <div onclick="navTo('itinerary')" id="nav-itinerary" class="sidebar-item"><i class="fas fa-map-marked-alt w-6"></i> Itinerary</div>
            <div onclick="navTo('roomlist')" id="nav-roomlist" class="sidebar-item"><i class="fas fa-hotel w-6"></i> Roomlist</div>
            <div onclick="navTo('perlengkapan')" id="nav-perlengkapan" class="sidebar-item"><i class="fas fa-boxes w-6"></i> Perlengkapan</div>
            <div onclick="navTo('pesanan')" id="nav-pesanan" class="sidebar-item"><i class="fas fa-bell-concierge w-6"></i> Pesanan</div>
            <div onclick="navTo('jamaah')" id="nav-jamaah" class="sidebar-item"><i class="fas fa-users w-6"></i> Data Jamaah</div>
            <div onclick="navTo('catatan')" id="nav-catatan" class="sidebar-item"><i class="fas fa-sticky-note w-6"></i> Catatan</div>
        </nav>
        
        <div class="absolute bottom-6 left-0 w-full px-6">
            <button onclick="toggleSidebar()" class="w-full py-3 bg-slate-100 rounded-xl text-slate-500 font-bold text-xs uppercase tracking-widest">
                <i class="fas fa-arrow-left mr-2"></i> Tutup Sidebar
            </button>
        </div>
    </aside>

    <!-- 4. MAIN CONTENT -->
    <main id="main-area" class="lg:ml-[280px] min-h-screen transition-all duration-300">
        <header class="h-20 flex items-center justify-between px-8 bg-white/60 backdrop-blur-md sticky top-0 z-40 border-b">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="w-10 h-10 bg-emerald-600 text-white rounded-lg flex items-center justify-center">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 id="page-title" class="text-lg font-bold text-slate-800 uppercase tracking-tighter">Dashboard</h1>
            </div>
            <div id="header-time" class="text-right">
                <p id="live-clock" class="font-bold text-emerald-700 leading-tight">00:00:00</p>
                <p id="live-date" class="text-[10px] uppercase font-bold text-slate-500">Loading...</p>
            </div>
        </header>

        <div id="content" class="p-6">
            <!-- Dynamic Content Here -->
        </div>
    </main>

    <!-- 5. MODAL POPUP -->
    <div id="modal" class="fixed inset-0 z-[110] hidden bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden animate-slide-up">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <h3 id="modal-title" class="font-bold text-slate-800">Detail</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-red-500"><i class="fas fa-times-circle text-2xl"></i></button>
            </div>
            <div id="modal-body" class="p-6 max-h-[80vh] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyo8IsAYBM8yZRB-GHfAfH0Hmss3XWNu2bW7ou4Lo7ktH8-RkM05VDfmsSEDlFzPWy5/exec'; // GANTI DENGAN URL DEPLOY SCRIPT ANDA
        let currentData = {};

        window.addEventListener('load', () => {
            setTimeout(() => {
                const ws = document.getElementById('welcome-screen');
                if(ws) ws.style.opacity = '0';
                setTimeout(() => ws ? ws.remove() : null, 1000);
            }, 2500);
            
            updateClock();
            setInterval(updateClock, 1000);
            navTo('dashboard');
        });

        function updateClock() {
            const now = new Date();
            const saudi = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Riyadh"}));
            document.getElementById('live-clock').innerText = saudi.toLocaleTimeString('id-ID', { hour12: false });
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const masehi = saudi.toLocaleDateString('id-ID', options);
            const hijri = new Intl.DateTimeFormat('id-ID-u-ca-islamic-uma', {day:'numeric', month:'long', year:'numeric'}).format(saudi);
            document.getElementById('live-date').innerText = `${hijri} H | ${masehi}`;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const main = document.getElementById('main-area');
            sidebar.classList.toggle('closed');
            if (window.innerWidth >= 1024) {
                main.classList.toggle('lg:ml-[280px]');
                main.classList.toggle('lg:ml-0');
            }
        }

        async function apiPost(action, sheet, data = {}) {
            document.getElementById('loading').style.display = 'flex';
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action, sheet, data })
                });
                const res = await response.json();
                return res;
            } catch (err) {
                console.error(err);
                return { status: 'error', data: [] };
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function navTo(page) {
            document.getElementById('page-title').innerText = page;
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            const activeNav = document.getElementById(`nav-${page}`);
            if(activeNav) activeNav.classList.add('active');
            
            if (window.innerWidth < 1024) document.getElementById('sidebar').classList.add('closed');
            
            await renderPage(page);
        }

        async function renderPage(page) {
            const container = document.getElementById('content');
            
            if (page === 'dashboard') {
                const res = await apiPost('getDashboard');
                container.innerHTML = renderDashboard(res.data || {});
                return;
            }

            const res = await apiPost('read', page);
            currentData[page] = Array.isArray(res) ? res : (res.data || []);
            
            let html = `<div class="glass-card p-6">`;
            if (['jamaah', 'roomlist', 'perlengkapan', 'itinerary'].includes(page)) {
                html += `
                <div class="mb-6 relative">
                    <i class="fas fa-search absolute left-4 top-4 text-slate-300"></i>
                    <input type="text" id="search-input" onkeyup="filterData('${page}')" placeholder="Pencarian cepat ${page}..." class="w-full pl-12 pr-4 py-3 rounded-2xl border-none ring-1 ring-slate-200 focus:ring-emerald-500 outline-none">
                </div>`;
            }

            html += `<div id="data-render">${renderList(page, currentData[page])}</div></div>`;
            container.innerHTML = html;
        }

        function renderDashboard(stats) {
            return `
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 space-y-6">
                    <div class="glass-card p-8 bg-emerald-900 text-white relative overflow-hidden">
                        <i class="fas fa-kaaba absolute right-[-20px] bottom-[-20px] text-9xl opacity-10"></i>
                        <h2 class="font-martel text-2xl font-bold">Labbaik Allahumma Labbaik</h2>
                        <p class="text-emerald-200 text-sm mt-2">Selamat bertugas, tim Handling Haji 2026</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="glass-card p-6">
                            <h3 class="text-xs font-bold uppercase text-slate-400 mb-4 border-b pb-2">🕌 Jadwal Sholat (Saudi)</h3>
                            <div class="grid grid-cols-2 gap-2 text-[11px] font-bold">
                                <div class="p-2 bg-slate-50 rounded">Subuh: 04:52</div>
                                <div class="p-2 bg-slate-50 rounded">Dzuhur: 12:21</div>
                                <div class="p-2 bg-slate-50 rounded">Ashar: 15:45</div>
                                <div class="p-2 bg-emerald-600 text-white rounded">Maghrib: 18:52</div>
                            </div>
                        </div>
                        <div class="glass-card p-6">
                            <h3 class="text-xs font-bold uppercase text-slate-400 mb-4 border-b pb-2">🛎️ Pesanan Aktif</h3>
                            <p class="text-2xl font-bold text-emerald-700">${stats.pesanan_pending ? stats.pesanan_pending.length : 0}</p>
                            <p class="text-[10px] text-slate-400">Pesanan logistik perlu dihandle</p>
                        </div>
                    </div>
                </div>
                <div class="space-y-6">
                    <div onclick="navTo('catatan')" class="glass-card p-6 border-t-4 border-emerald-600 cursor-pointer hover:shadow-lg transition">
                        <h3 class="font-bold text-slate-800 mb-4"><i class="fas fa-pen-nib text-emerald-600 mr-2"></i> Catatan Terbaru</h3>
                        <div class="space-y-3">
                            ${stats.catatan_terbaru ? stats.catatan_terbaru.map(c => `
                                <div class="p-3 bg-emerald-50 rounded-xl">
                                    <p class="text-xs font-bold">${c.judul || 'Tanpa Judul'}</p>
                                    <p class="text-[10px] text-slate-500 truncate">${c.isi || ''}</p>
                                </div>
                            `).join('') : '<p class="text-xs text-slate-400">Belum ada catatan.</p>'}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderList(page, data) {
            if (!data || data.length === 0) return `<p class="text-center p-10 text-slate-400">Data masih kosong.</p>`;
            
            let html = `<div class="overflow-x-auto"><table class="w-full text-left border-collapse">`;
            
            if (page === 'itinerary') {
                html += `<thead class="bg-slate-50 text-[10px] uppercase font-bold text-slate-400">
                    <tr><th class="px-4 py-3">Waktu Saudi</th><th class="px-4 py-3">Kegiatan</th><th class="px-4 py-3">Lokasi</th></tr>
                </thead><tbody class="divide-y">`;
                data.forEach(item => {
                    html += `<tr class="hover:bg-emerald-50 cursor-pointer transition" onclick='showDetail("itinerary", ${JSON.stringify(item)})'>
                        <td class="px-4 py-4 font-bold text-emerald-700 text-sm">${item.waktu_saudi || '-'}</td>
                        <td class="px-4 py-4 text-sm font-semibold">${item.kegiatan || '-'}</td>
                        <td class="px-4 py-4 text-xs text-slate-500">${item.lokasi || '-'}</td></tr>`;
                });
            } else if (page === 'jamaah') {
                html += `<thead class="bg-slate-50 text-[10px] uppercase font-bold text-slate-400">
                    <tr><th class="px-4 py-3">Bus</th><th class="px-4 py-3">Nama Lengkap</th><th class="px-4 py-3">Kode JI</th></tr>
                </thead><tbody class="divide-y">`;
                data.forEach(item => {
                    html += `<tr class="hover:bg-emerald-50 cursor-pointer" onclick='showDetail("jamaah", ${JSON.stringify(item)})'>
                        <td class="px-4 py-4"><span class="px-2 py-1 bg-slate-100 rounded text-[10px] font-bold">${item.bus || '-'}</span></td>
                        <td class="px-4 py-4 text-sm font-bold text-slate-800">${item.nama_lengkap || '-'}</td>
                        <td class="px-4 py-4 text-xs text-slate-400 font-mono">${item.kode_ji || '-'}</td></tr>`;
                });
            } else {
                // Generic Table for other pages
                const headers = Object.keys(data[0]).filter(h => h !== 'id');
                html += `<thead class="bg-slate-50 text-[10px] uppercase font-bold text-slate-400"><tr>`;
                headers.forEach(h => html += `<th class="px-4 py-3">${h.replace(/_/g,' ')}</th>`);
                html += `</tr></thead><tbody class="divide-y">`;
                data.forEach(item => {
                    html += `<tr class="hover:bg-emerald-50 cursor-pointer" onclick='showDetail("${page}", ${JSON.stringify(item)})'>`;
                    headers.forEach(h => html += `<td class="px-4 py-4 text-sm">${item[h] || '-'}</td>`);
                    html += `</tr>`;
                });
            }

            html += `</tbody></table></div>
                <button onclick="openEntryForm('${page}')" class="fixed bottom-10 right-10 w-14 h-14 bg-emerald-600 text-white rounded-full shadow-2xl flex items-center justify-center hover:scale-110 transition active:scale-95 z-40">
                    <i class="fas fa-plus text-xl"></i>
                </button>`;
            return html;
        }

        function showDetail(type, item) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            
            modal.classList.remove('hidden');
            title.innerText = `DETAIL ${type.toUpperCase()}`;
            
            let html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">`;
            for (let key in item) {
                if (key === 'id') continue;
                html += `<div class="border-b pb-2">
                    <p class="text-[10px] font-bold text-slate-400 mb-1">${key.replace(/_/g, ' ').toUpperCase()}</p>
                    <p class="text-sm font-bold text-slate-700">${item[key] || '-'}</p>
                </div>`;
            }
            
            html += `</div>
                <div class="mt-8 flex gap-3">
                    <button onclick='editData("${type}", ${JSON.stringify(item)})' class="flex-1 py-3 bg-emerald-50 text-emerald-700 rounded-xl font-bold text-xs"><i class="fas fa-edit mr-2"></i> EDIT</button>
                    <button onclick="deleteData('${type}', '${item.id}')" class="flex-1 py-3 bg-red-50 text-red-600 rounded-xl font-bold text-xs"><i class="fas fa-trash mr-2"></i> HAPUS</button>
                </div>`;
            body.innerHTML = html;
        }

        function filterData(page) {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = currentData[page].filter(item => 
                Object.values(item).some(val => String(val).toLowerCase().includes(query))
            );
            document.getElementById('data-render').innerHTML = renderList(page, filtered);
        }

        function openEntryForm(page, existingData = null) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            
            modal.classList.remove('hidden');
            title.innerText = existingData ? `EDIT ${page.toUpperCase()}` : `TAMBAH ${page.toUpperCase()}`;
            
            const fields = currentData[page] && currentData[page][0] ? Object.keys(currentData[page][0]) : [];
            let html = `<form id="form-entry" class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
            
            fields.forEach(key => {
                if (key === 'id') {
                    if(existingData) html += `<input type="hidden" name="id" value="${existingData.id}">`;
                    return;
                }
                const val = existingData ? existingData[key] : '';
                html += `<div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">${key.replace(/_/g,' ')}</label>
                    <input type="text" name="${key}" value="${val}" class="w-full p-3 rounded-xl border mt-1 text-sm focus:ring-emerald-500 outline-none">
                </div>`;
            });
            
            html += `<div class="md:col-span-2 mt-4">
                <button type="button" onclick="submitData('${page}', ${existingData ? "'update'" : "'insert'"})" class="w-full py-4 bg-emerald-600 text-white rounded-2xl font-bold shadow-lg">SIMPAN DATA</button>
            </div></form>`;
            
            body.innerHTML = html;
        }

        function editData(page, item) {
            openEntryForm(page, item);
        }

        async function submitData(page, action) {
            const form = document.getElementById('form-entry');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            const res = await apiPost(action, page, data);
            if (res.status === 'success') {
                alert('Berhasil!');
                closeModal();
                navTo(page);
            } else {
                alert('Gagal menyimpan data.');
            }
        }

        async function deleteData(page, id) {
            if (confirm('Yakin ingin menghapus data ini?')) {
                const res = await apiPost('delete', page, { id });
                if (res.status === 'success') {
                    closeModal();
                    navTo(page);
                }
            }
        }

        function closeModal() { 
            document.getElementById('modal').classList.add('hidden'); 
            document.getElementById('modal-body').innerHTML = '';
        }
    </script>
</body>
</html>
