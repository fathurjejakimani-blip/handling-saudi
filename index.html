<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Handling Haji 2026 - Jejak Imani</title>
    
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700&family=Martel:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --ji-primary: #0f172a;
            --ji-accent: #059669;
            --ji-gold: #d4af37;
        }

        body { 
            font-family: 'Mulish', sans-serif; 
            background: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: url('https://lh3.googleusercontent.com/d/1S04aXsEdKJ1qAKSNnDNwkzQU5drK2MlP') no-repeat center center fixed;
            background-size: cover;
            opacity: 0.15;
            z-index: -1;
        }

        h1, h2, h3, .font-martel { font-family: 'Martel', serif; }

        #welcome-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-out;
        }
        
        .logo-anim {
            width: 180px;
            animation: pulse-logo 2s infinite ease-in-out;
        }

        @keyframes pulse-logo {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
        }
        
        .sidebar.closed { transform: translateX(-100%); }
        
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            margin: 4px 16px;
            border-radius: 14px;
            color: #64748b;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background: var(--ji-accent);
            color: white;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 24px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }

        .btn-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            background: var(--ji-accent);
            color: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 10px 25px rgba(5, 150, 105, 0.3);
            cursor: pointer;
            z-index: 45;
            transition: all 0.3s;
        }
        .btn-float:hover { transform: scale(1.1) rotate(5deg); }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: none;
            animation: slide-up 0.3s ease-out;
        }

        @keyframes slide-up {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .animate-slide-up { animation: slide-up 0.4s ease-out; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="custom-scrollbar">

    <div class="bg-overlay"></div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast px-6 py-3 bg-slate-800 text-white text-xs font-bold rounded-full shadow-2xl items-center gap-3">
        <i class="fas fa-check-circle text-emerald-400"></i>
        <span id="toast-msg">Berhasil diperbarui</span>
    </div>

    <!-- 1. WELCOME SCREEN -->
    <div id="welcome-screen">
        <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="logo-anim" alt="Logo">
        <p class="mt-4 font-martel font-bold text-slate-800 tracking-[0.3em] uppercase text-[10px]">Sistem Handling Haji 2026</p>
    </div>

    <!-- 2. LOADING INDICATOR -->
    <div id="loading" class="fixed top-20 left-1/2 -translate-x-1/2 hidden bg-white px-5 py-2 rounded-full shadow-xl z-[100] items-center gap-2 border border-emerald-50">
        <i class="fas fa-circle-notch fa-spin text-emerald-600 text-xs"></i>
        <span class="text-[10px] font-black text-slate-600 uppercase tracking-widest">Sinkronisasi...</span>
    </div>

    <!-- 3. SIDEBAR -->
    <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 shadow-xl border-r border-white/50">
        <div class="p-8 flex justify-between items-center">
            <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="w-24">
            <button onclick="toggleSidebar()" class="lg:hidden text-slate-400"><i class="fas fa-times"></i></button>
        </div>
        <nav class="mt-2 space-y-1">
            <div onclick="navTo('dashboard')" id="nav-dashboard" class="sidebar-item active"><i class="fas fa-th-large w-5"></i> Dashboard</div>
            <div onclick="navTo('jamaah')" id="nav-jamaah" class="sidebar-item"><i class="fas fa-user-group w-5"></i> Data Jamaah</div>
            <div onclick="navTo('roomlist')" id="nav-roomlist" class="sidebar-item"><i class="fas fa-bed w-5"></i> Roomlist</div>
            <div onclick="navTo('itinerary')" id="nav-itinerary" class="sidebar-item"><i class="fas fa-route w-5"></i> Itinerary</div>
            <div onclick="navTo('transport')" id="nav-transport" class="sidebar-item"><i class="fas fa-bus w-5"></i> Transportasi</div>
            <div onclick="navTo('perlengkapan')" id="nav-perlengkapan" class="sidebar-item"><i class="fas fa-box w-5"></i> Logistik</div>
            <div onclick="navTo('pesanan')" id="nav-pesanan" class="sidebar-item"><i class="fas fa-concierge-bell w-5"></i> Pesanan</div>
            <div onclick="navTo('absensi')" id="nav-absensi" class="sidebar-item"><i class="fas fa-clipboard-check w-5"></i> Absensi</div>
            <div onclick="navTo('catatan')" id="nav-catatan" class="sidebar-item"><i class="fas fa-sticky-note w-5"></i> Catatan</div>
        </nav>
    </aside>

    <!-- 4. MAIN CONTENT -->
    <main id="main-area" class="lg:ml-[280px] min-h-screen transition-all duration-300">
        <header class="h-20 flex items-center justify-between px-6 lg:px-10 sticky top-0 z-40 bg-white/40 backdrop-blur-lg border-b border-white/20">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="w-10 h-10 bg-white shadow-sm border border-slate-100 text-slate-600 rounded-xl flex items-center justify-center lg:hidden">
                    <i class="fas fa-bars-staggered"></i>
                </button>
                <h1 id="page-title" class="text-sm font-black text-slate-800 uppercase tracking-widest">Dashboard</h1>
            </div>
            <div class="flex items-center gap-4 text-right">
                <div class="hidden md:block">
                    <p id="live-date" class="text-[9px] uppercase font-bold text-slate-400">Loading...</p>
                    <p id="live-clock" class="text-sm font-black text-emerald-600 tabular-nums">00:00:00</p>
                </div>
                <button onclick="refreshData()" class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center hover:rotate-180 transition-all duration-500">
                    <i class="fas fa-sync-alt text-xs"></i>
                </button>
            </div>
        </header>

        <div id="content" class="p-6 lg:p-10 pb-24">
            <!-- Dynamic Content -->
        </div>

        <div id="floating-action"></div>
    </main>

    <!-- 5. MODAL -->
    <div id="modal" class="fixed inset-0 z-[110] hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target === this) closeModal()">
        <div class="bg-white w-full max-w-2xl rounded-[32px] shadow-2xl overflow-hidden animate-slide-up border border-white/20">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50/50">
                <h3 id="modal-title" class="font-bold text-slate-800 text-xs uppercase tracking-widest">Detail</h3>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-300 hover:text-red-500 transition"><i class="fas fa-times"></i></button>
            </div>
            <div id="modal-body" class="p-8 max-h-[75vh] overflow-y-auto custom-scrollbar"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbw_qAjeQ5SdQd2461CW1mV3M3WdmkEinuBCJRqLc8aakBdADi-W0sURCf-iuVaAcH-m/exec';
        let currentData = JSON.parse(localStorage.getItem('haji_cache')) || {};
        let prayTimes = null;
        let currentPage = 'dashboard';

        // Init App
        window.addEventListener('load', () => {
            setTimeout(() => {
                const ws = document.getElementById('welcome-screen');
                if(ws) {
                    ws.style.opacity = '0';
                    setTimeout(() => ws.remove(), 800);
                }
            }, 1200);
            
            fetchPrayTimes();
            updateClock();
            setInterval(updateClock, 1000);
            navTo('dashboard');
        });

        function updateClock() {
            const now = new Date();
            const timeOpt = { timeZone: "Asia/Riyadh", hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const dateOpt = { timeZone: "Asia/Riyadh", weekday: 'long', day: 'numeric', month: 'long' };
            const hijriOpt = { timeZone: "Asia/Riyadh", calendar: 'islamic-uma', day: 'numeric', month: 'long', year: 'numeric' };

            const liveClock = document.getElementById('live-clock');
            if(liveClock) liveClock.innerText = new Intl.DateTimeFormat('id-ID', timeOpt).format(now);
            
            const liveDate = document.getElementById('live-date');
            if(liveDate) {
                const masehi = new Intl.DateTimeFormat('id-ID', dateOpt).format(now);
                const hijri = new Intl.DateTimeFormat('id-ID-u-ca-islamic-uma', hijriOpt).format(now);
                liveDate.innerText = `${hijri} • ${masehi}`;
            }
        }

        async function fetchPrayTimes() {
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Makkah&country=Saudi+Arabia&method=4');
                const json = await res.json();
                prayTimes = json.data.timings;
                if(currentPage === 'dashboard') renderPage('dashboard', false);
            } catch (e) { console.warn("Gagal ambil jadwal sholat"); }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('closed');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.style.display = 'flex';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        async function navTo(page) {
            currentPage = page;
            document.getElementById('page-title').innerText = page;
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            const navEl = document.getElementById(`nav-${page}`);
            if(navEl) navEl.classList.add('active');
            
            if (window.innerWidth < 1024) document.getElementById('sidebar').classList.add('closed');
            
            renderPage(page, true);
            refreshData(page);
        }

        async function refreshData(page = currentPage) {
            document.getElementById('loading').style.display = 'flex';
            try {
                let url = page === 'dashboard' ? `${API_URL}?action=getDashboard` : `${API_URL}?action=read&sheet=${page}`;
                const response = await fetch(url);
                const res = await response.json();
                
                currentData[page] = res.data || res;
                localStorage.setItem('haji_cache', JSON.stringify(currentData));
                renderPage(page, false);
            } catch (e) {
                console.error("Fetch error:", e);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderPage(page, isCache) {
            const container = document.getElementById('content');
            const fab = document.getElementById('floating-action');
            const data = currentData[page];

            if (page === 'dashboard') {
                fab.innerHTML = '';
                container.innerHTML = renderDashboard(data || {});
            } else {
                fab.innerHTML = `<div onclick="openEntryForm('${page}')" class="btn-float"><i class="fas fa-plus"></i></div>`;
                
                let html = `
                <div class="glass-card p-6 lg:p-8 animate-slide-up">
                    <div class="flex flex-col md:flex-row gap-4 mb-8">
                        <div class="relative flex-1">
                            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 text-sm"></i>
                            <input type="text" id="search-input" onkeyup="filterData('${page}')" placeholder="Cari data..." 
                                class="w-full pl-12 pr-4 py-3 bg-slate-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-emerald-500 transition outline-none">
                        </div>
                    </div>
                    <div id="data-render" class="overflow-hidden">${renderList(page, data)}</div>
                </div>`;
                container.innerHTML = html;
            }
        }

        function renderDashboard(stats) {
            const pt = prayTimes || { Fajr: '--', Dhuhr: '--', Asr: '--', Maghrib: '--', Isha: '--' };
            const jamaahCount = currentData['jamaah']?.length || 0;
            const noteCount = currentData['catatan']?.length || 0;

            return `
            <div class="space-y-6 animate-slide-up">
                <!-- Quick Stats Row -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="glass-card p-4 flex items-center gap-4">
                        <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center"><i class="fas fa-users"></i></div>
                        <div><p class="text-[9px] font-bold text-slate-400 uppercase">Jamaah</p><p class="text-lg font-black text-slate-800">${jamaahCount}</p></div>
                    </div>
                    <div class="glass-card p-4 flex items-center gap-4">
                        <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center"><i class="fas fa-door-open"></i></div>
                        <div><p class="text-[9px] font-bold text-slate-400 uppercase">Kamar</p><p class="text-lg font-black text-slate-800">${currentData['roomlist']?.length || 0}</p></div>
                    </div>
                    <div class="glass-card p-4 flex items-center gap-4">
                        <div class="w-10 h-10 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center"><i class="fas fa-tasks"></i></div>
                        <div><p class="text-[9px] font-bold text-slate-400 uppercase">Pesanan</p><p class="text-lg font-black text-slate-800">${currentData['pesanan']?.length || 0}</p></div>
                    </div>
                    <div class="glass-card p-4 flex items-center gap-4">
                        <div class="w-10 h-10 bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center"><i class="fas fa-notes-medical"></i></div>
                        <div><p class="text-[9px] font-bold text-slate-400 uppercase">Notes</p><p class="text-lg font-black text-slate-800">${noteCount}</p></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 space-y-6">
                        <!-- Hero -->
                        <div class="glass-card p-8 bg-slate-900 text-white relative overflow-hidden">
                            <div class="relative z-10">
                                <h2 class="text-xl font-martel font-bold">Ahlan wa Sahlan, Labbaik Allahumma Labbaik</h2>
                                <p class="text-emerald-400 text-[10px] uppercase tracking-[0.2em] font-bold mt-1">Management Haji 2026</p>
                            </div>
                            <i class="fas fa-kaaba absolute -right-10 -bottom-10 text-[180px] text-white/5 rotate-12"></i>
                        </div>

                        <!-- Prayer Times -->
                        <div class="glass-card p-6">
                            <h3 class="text-[10px] font-black uppercase text-slate-400 mb-4 flex items-center gap-2">
                                <i class="fas fa-mosque text-emerald-600"></i> Waktu Sholat Makkah
                            </h3>
                            <div class="grid grid-cols-5 gap-2 text-center">
                                ${Object.entries({ Subuh: pt.Fajr, Dzuhur: pt.Dhuhr, Ashar: pt.Asr, Maghrib: pt.Maghrib, Isya: pt.Isha }).map(([n, v]) => `
                                    <div class="p-2 ${n === 'Subuh' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-100' : 'bg-slate-50 text-slate-600'} rounded-xl">
                                        <p class="text-[8px] font-bold uppercase mb-1">${n}</p>
                                        <p class="text-[11px] font-black">${v}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Orders -->
                        <div class="glass-card p-6">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="text-[10px] font-black uppercase text-slate-400">🛎️ Pesanan Terbaru</h3>
                                <button onclick="navTo('pesanan')" class="text-emerald-600 font-bold text-[10px]">LIHAT SEMUA</button>
                            </div>
                            <div class="space-y-3">
                                ${(currentData['pesanan'] || []).slice(0, 3).map(p => `
                                    <div class="flex items-center justify-between p-4 bg-white/50 rounded-2xl border border-white">
                                        <div class="flex items-center gap-3">
                                            <div class="w-8 h-8 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center text-[10px]"><i class="fas fa-bell"></i></div>
                                            <div>
                                                <p class="text-xs font-bold text-slate-800">${p.nama_pesanan || p.item || 'Pesanan'}</p>
                                                <p class="text-[9px] text-slate-400 font-bold">Lokasi: ${p.kamar || p.lokasi || '-'}</p>
                                            </div>
                                        </div>
                                        <span class="text-[8px] px-2 py-1 ${p.status === 'Selesai' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'} rounded-md font-black uppercase">${p.status || 'PROSES'}</span>
                                    </div>
                                `).join('') || '<p class="text-center py-4 text-xs text-slate-300 italic">Belum ada pesanan aktif</p>'}
                            </div>
                        </div>
                    </div>

                    <!-- Sidebar Notes -->
                    <div class="glass-card p-6 flex flex-col">
                        <h3 class="text-[10px] font-black uppercase text-slate-400 mb-6 flex items-center gap-2">
                            <i class="fas fa-sticky-note text-amber-500"></i> Catatan Operasional
                        </h3>
                        <div class="space-y-4 flex-1">
                            ${(currentData['catatan'] || []).slice(0, 5).map(c => `
                                <div class="p-4 bg-amber-50/40 border-l-4 border-amber-400 rounded-r-2xl">
                                    <p class="text-xs font-black text-slate-800 mb-1">${c.judul}</p>
                                    <p class="text-[10px] text-slate-600 line-clamp-2">${c.isi}</p>
                                </div>
                            `).join('') || '<p class="text-center py-10 text-xs text-slate-300 italic">Kosong</p>'}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderList(page, data) {
            if (!data || data.length === 0) {
                return `<div class="text-center py-20"><i class="fas fa-folder-open text-4xl text-slate-100 mb-4 block"></i><p class="text-slate-400 text-sm">Data masih kosong</p></div>`;
            }
            
            const headers = Object.keys(data[0]).filter(h => h.toLowerCase() !== 'id');
            
            let html = `<div class="overflow-x-auto"><table class="w-full min-w-[600px]">
                <thead><tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">`;
            headers.forEach(h => html += `<th class="px-4 py-4 text-left">${h.replace(/_/g,' ')}</th>`);
            html += `</tr></thead><tbody class="divide-y divide-slate-50">`;

            data.forEach(item => {
                html += `<tr class="hover:bg-slate-50/50 cursor-pointer transition group" onclick='showDetail("${page}", ${JSON.stringify(item)})'>`;
                headers.forEach(h => {
                    let val = item[h] || '-';
                    let badgeClass = "";
                    if (val === 'Selesai' || val === 'Lunas') badgeClass = "text-emerald-600 font-bold";
                    if (val === 'Pending' || val === 'Proses') badgeClass = "text-amber-600 font-bold";
                    
                    html += `<td class="px-4 py-4 text-[11px] font-semibold text-slate-600 group-hover:text-emerald-600 transition ${badgeClass}">${val}</td>`;
                });
                html += `</tr>`;
            });

            return html + `</tbody></table></div>`;
        }

        function showDetail(type, item) {
            const body = document.getElementById('modal-body');
            document.getElementById('modal-title').innerText = `Opsi ${type}`;
            
            let html = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-8">`;
            for (let key in item) {
                if(key.toLowerCase() === 'id') continue;
                html += `
                <div class="p-4 bg-slate-50 rounded-2xl">
                    <p class="text-[9px] font-black text-slate-400 uppercase mb-0.5">${key.replace(/_/g,' ')}</p>
                    <p class="text-xs font-bold text-slate-800">${item[key] || '-'}</p>
                </div>`;
            }
            html += `</div><div class="flex flex-col sm:flex-row gap-3">
                <button onclick='editData("${type}", ${JSON.stringify(item)})' class="flex-1 py-4 bg-emerald-600 text-white rounded-2xl font-black text-[10px] uppercase tracking-widest shadow-lg shadow-emerald-100">Edit</button>
                <button onclick='deleteData("${type}", "${item.id}")' class="flex-1 py-4 bg-red-50 text-red-600 rounded-2xl font-black text-[10px] uppercase tracking-widest">Hapus</button>
                <button onclick="closeModal()" class="px-8 py-4 bg-slate-100 text-slate-400 rounded-2xl font-black text-[10px] uppercase tracking-widest">Tutup</button>
            </div>`;
            
            body.innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
        }

        async function deleteData(page, id) {
            if(!confirm('Yakin ingin menghapus data ini?')) return;
            
            document.getElementById('loading').style.display = 'flex';
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', sheet: page, id: id })
                });
                showToast('Data berhasil dihapus');
                closeModal();
                refreshData(page);
            } catch (err) {
                alert('Gagal menghapus data');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function openEntryForm(page, existingData = null) {
            const body = document.getElementById('modal-body');
            document.getElementById('modal-title').innerText = existingData ? `Update ${page}` : `Tambah ${page}`;
            
            let fields = (currentData[page] && currentData[page][0]) ? Object.keys(currentData[page][0]) : ['id', 'nama', 'keterangan'];

            let html = `<form id="form-entry" class="grid grid-cols-1 sm:grid-cols-2 gap-4">`;
            fields.forEach(key => {
                if (key.toLowerCase() === 'id') {
                    html += `<input type="hidden" name="id" value="${existingData?.id || ''}">`;
                    return;
                }
                const val = existingData ? existingData[key] : '';
                const isArea = key.toLowerCase() === 'isi' || key.toLowerCase() === 'keterangan' || key.toLowerCase() === 'alamat';
                
                html += `<div class="${isArea ? 'sm:col-span-2' : ''}">
                    <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">${key.replace(/_/g,' ')}</label>`;
                
                if (isArea) {
                    html += `<textarea name="${key}" rows="3" class="w-full p-4 bg-slate-50 border-none rounded-2xl mt-1 text-xs font-bold focus:ring-2 focus:ring-emerald-500 outline-none">${val}</textarea>`;
                } else {
                    const type = key.includes('tanggal') ? 'date' : key.includes('waktu') ? 'time' : 'text';
                    html += `<input type="${type}" name="${key}" value="${val}" class="w-full p-4 bg-slate-50 border-none rounded-2xl mt-1 text-xs font-bold focus:ring-2 focus:ring-emerald-500 outline-none">`;
                }
                html += `</div>`;
            });
            
            html += `<div class="sm:col-span-2 mt-4">
                <button type="button" onclick="submitData('${page}', ${existingData ? "'update'" : "'insert'"})" 
                    class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black text-[10px] uppercase tracking-[0.2em] shadow-xl transition hover:bg-emerald-600">Simpan Data</button>
            </div></form>`;
            
            body.innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
        }

        async function submitData(page, action) {
            const form = document.getElementById('form-entry');
            const data = Object.fromEntries(new FormData(form).entries());
            
            document.getElementById('loading').style.display = 'flex';
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action, sheet: page, data })
                });
                showToast('Berhasil disimpan');
                closeModal();
                refreshData(page);
            } catch (err) {
                alert('Gagal memproses data');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function filterData(page) {
            const query = document.getElementById('search-input').value.toLowerCase();
            if(!currentData[page]) return;
            const filtered = currentData[page].filter(item => 
                Object.values(item).some(val => String(val).toLowerCase().includes(query))
            );
            document.getElementById('data-render').innerHTML = renderList(page, filtered);
        }

        function editData(page, item) { openEntryForm(page, item); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
    </script>
</body>
</html>
