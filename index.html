<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handling Haji 2026 - Jejak Imani</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Martel:wght@700&family=Mulish:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Mulish', sans-serif; background-color: #f0f4f0; }
        h1, h2, h3 { font-family: 'Martel', serif; }
        
        /* Fix Background & Overlay */
        .bg-app { 
            background: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)), 
                        url('https://lh3.googleusercontent.com/d/1S04aXsEdKJ1qAKSNnDNwkzQU5drK2MlP');
            background-size: cover; background-attachment: fixed;
        }
        
        .sidebar-active { background: #064e3b; color: #fbbf24; border-left: 4px solid #fbbf24; }
        
        /* Smooth Transition */
        .page-transition { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Loader */
        .spinner { border: 3px solid rgba(0,0,0,0.1); border-left-color: #059669; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-app min-h-screen text-slate-800">

    <!-- Splash Screen Dinamis -->
    <div id="splash" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center transition-opacity duration-700">
        <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="w-32 animate-bounce">
        <div class="mt-4 flex items-center gap-2">
            <div class="spinner"></div>
            <p class="text-sm font-bold text-green-900 tracking-widest uppercase">Menghubungkan Server...</p>
        </div>
    </div>

    <div id="main-app" class="hidden flex min-h-screen">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-[#042f2e] text-white shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out lg:translate-x-0 lg:static lg:block">
            <div class="p-6">
                <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="w-24 mb-10 brightness-200">
                <nav class="space-y-2" id="nav-menu">
                    <button onclick="showPage('dashboard')" class="w-full text-left p-4 rounded-xl transition flex items-center gap-3 sidebar-active"><span>📊</span> Dashboard</button>
                    <button onclick="showPage('itinerary')" class="w-full text-left p-4 rounded-xl transition flex items-center gap-3 hover:bg-white/10"><span>📅</span> Itinerary</button>
                    <button onclick="showPage('roomlist')" class="w-full text-left p-4 rounded-xl transition flex items-center gap-3 hover:bg-white/10"><span>🏨</span> Roomlist</button>
                    <button onclick="showPage('pesanan')" class="w-full text-left p-4 rounded-xl transition flex items-center gap-3 hover:bg-white/10"><span>🛎️</span> Pesanan</button>
                    <button onclick="showPage('jamaah')" class="w-full text-left p-4 rounded-xl transition flex items-center gap-3 hover:bg-white/10"><span>👥</span> Data Jamaah</button>
                </nav>
            </div>
        </aside>

        <main class="flex-1 flex flex-col">
            <header class="p-4 md:p-6 flex justify-between items-center bg-white/50 backdrop-blur-md sticky top-0 z-40 border-b border-green-100">
                <button onclick="toggleSidebar()" class="lg:hidden text-2xl p-2">☰</button>
                <div class="flex flex-col">
                    <h2 id="page-title" class="text-xl font-bold text-green-900">DASHBOARD</h2>
                    <p class="text-[10px] text-green-700 font-bold tracking-widest">SISTEM HANDLING HAJI 2026</p>
                </div>
                <div id="header-loader" class="hidden"><div class="spinner"></div></div>
            </header>

            <div id="content-render" class="p-4 md:p-8 page-transition">
                <!-- Content injected here -->
            </div>
        </main>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw3t4ld9deKYGr7OANyiinlCDR9WJqjaQ5NIrxUy7D2faUS8IGBdXlkRhW5E-LtQ_8e/exec';
        
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash').style.display = 'none';
                    document.getElementById('main-app').classList.remove('hidden');
                    showPage('dashboard');
                }, 700);
            }, 1500);
        };

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        async function showPage(page) {
            const container = document.getElementById('content-render');
            const loader = document.getElementById('header-loader');
            
            document.getElementById('page-title').innerText = page.toUpperCase();
            loader.classList.remove('hidden');

            // Update Nav UI
            document.querySelectorAll('#nav-menu button').forEach(btn => {
                btn.classList.remove('sidebar-active');
                if(btn.innerText.toLowerCase().includes(page)) btn.classList.add('sidebar-active');
            });

            try {
                const res = await fetch(`${SCRIPT_URL}?action=get${page.charAt(0).toUpperCase() + page.slice(1)}`);
                const data = await res.json();
                
                if(page === 'dashboard') renderDashboard(data);
                if(page === 'itinerary') renderItinerary(data);
                if(page === 'roomlist') renderRoomlist(data);
                if(page === 'pesanan') renderPesanan(data);
                if(page === 'jamaah') renderJamaah(data);

            } catch (e) {
                container.innerHTML = `<div class="bg-red-50 p-6 rounded-2xl text-red-700 text-center">Gagal memuat data. Periksa koneksi Internet.</div>`;
            } finally {
                loader.classList.add('hidden');
                if(window.innerWidth < 1024) toggleSidebar();
            }
        }

        function renderDashboard(data) {
            const now = new Date();
            const saudi = new Date(now.getTime() - (4 * 60 * 60 * 1000));
            
            document.getElementById('content-render').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-gradient-to-br from-green-900 to-[#042f2e] text-white p-8 rounded-3xl shadow-xl relative overflow-hidden">
                        <div class="relative z-10">
                            <h3 class="text-xs font-bold text-yellow-400 mb-4 tracking-tighter uppercase">Waktu Arab Saudi</h3>
                            <p class="text-5xl font-bold mb-2">${saudi.getHours()}:${saudi.getMinutes().toString().padStart(2,'0')}</p>
                            <p class="text-sm opacity-80">${saudi.toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})}</p>
                        </div>
                        <div class="absolute right-[-20px] bottom-[-20px] opacity-10 text-[120px]">🕋</div>
                    </div>
                    
                    <div class="bg-white p-6 rounded-3xl border border-green-100 shadow-sm">
                        <h3 class="font-bold text-green-900 mb-4 flex items-center gap-2"><span>🕌</span> Jadwal Sholat Makkah</h3>
                        <div class="grid grid-cols-3 gap-3">
                            ${['Subuh 04:50','Dzuhur 12:22','Ashar 15:45','Maghrib 18:50','Isya 20:20'].map(s => `
                                <div class="p-3 bg-green-50 rounded-xl text-center">
                                    <p class="text-[10px] uppercase text-green-600 font-bold">${s.split(' ')[0]}</p>
                                    <p class="text-sm font-bold text-green-900">${s.split(' ')[1]}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="md:col-span-2 bg-white rounded-3xl border border-green-100 p-6">
                        <h3 class="font-bold text-green-900 mb-4">Agenda Utama Hari Ini</h3>
                        <div class="space-y-4">
                            ${data.itinerary.slice(0,2).map(i => `
                                <div class="flex items-center gap-4 p-4 hover:bg-gray-50 rounded-2xl transition">
                                    <div class="bg-yellow-400 text-green-950 font-bold p-3 rounded-xl text-center min-w-[80px]">
                                        <p class="text-xs uppercase">Saudi</p>
                                        <p class="text-lg">${i.waktu_saudi}</p>
                                    </div>
                                    <div>
                                        <p class="font-bold text-green-950">${i.kegiatan}</p>
                                        <p class="text-xs text-gray-500">WIB: ${i.waktu_wib}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>`;
        }

        function renderPesanan(data) {
            document.getElementById('content-render').innerHTML = `
                <div class="grid gap-4">
                    ${data.length === 0 ? `<p class="text-center p-10 text-gray-400">Tidak ada pesanan aktif</p>` : 
                    data.map(p => `
                        <div class="bg-white p-5 rounded-2xl border-l-8 ${p.status_pesanan==='Pending'?'border-red-500':'border-yellow-500'} shadow-sm flex flex-col md:flex-row justify-between md:items-center gap-4">
                            <div>
                                <span class="px-2 py-1 bg-gray-100 text-[10px] font-bold rounded uppercase">${p.waktu_order}</span>
                                <h4 class="font-bold text-green-900 text-lg mt-1">Kamar ${p.no_kamar} - ${p.nama_barang}</h4>
                                <p class="text-sm text-gray-500">Jumlah: <span class="font-bold text-green-700">${p.qty}</span></p>
                            </div>
                            <div class="flex gap-2">
                                <select onchange="updateStatus('${p.id}', this.value)" class="bg-gray-50 border p-3 rounded-xl text-sm font-bold outline-none">
                                    <option value="Pending" ${p.status_pesanan==='Pending'?'selected':''}>Pending</option>
                                    <option value="Proses" ${p.status_pesanan==='Proses'?'selected':''}>Proses</option>
                                    <option value="Selesai">Selesai</option>
                                </select>
                            </div>
                        </div>
                    `).join('')}
                </div>`;
        }
        
        async function updateStatus(id, status) {
            document.getElementById('header-loader').classList.remove('hidden');
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: new URLSearchParams({ action: 'updateStatusPesanan', id: id, status: status })
                });
                showPage('pesanan');
            } catch(e) { alert('Gagal update status'); }
        }

        // Render functions lainnya (Roomlist, Jamaah) mengikuti pola yang sama dengan styling Tailwind yang serupa.
    </script>
</body>
</html>
