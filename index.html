<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Handling - Jejak Imani</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .sidebar-item { transition: all 0.2s ease; color: #64748b; font-weight: 500; cursor: pointer; }
        .sidebar-item.active { background-color: #ecfdf5; color: #059669; font-weight: 700; border-right: 4px solid #059669; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; }
        .modal-bg { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); }
        
        #global-loader { background: white; transition: opacity 0.5s ease; }
        .animate-reveal { animation: reveal 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes reveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex">

    <!-- LOADING STATE -->
    <div id="global-loader" class="fixed inset-0 z-[200] flex items-center justify-center">
        <div class="text-center">
            <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="w-24 mb-4 animate-pulse mx-auto">
            <div class="flex justify-center gap-1">
                <div class="w-2 h-2 bg-emerald-600 rounded-full animate-bounce"></div>
                <div class="w-2 h-2 bg-emerald-600 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                <div class="w-2 h-2 bg-emerald-600 rounded-full animate-bounce [animation-delay:-0.5s]"></div>
            </div>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white shadow-2xl transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out border-r border-slate-100">
        <div class="flex flex-col h-full">
            <div class="p-8 flex justify-between items-center border-b border-slate-50">
                <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="w-28">
                <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                <div onclick="navTo('dashboard')" id="btn-dashboard" class="sidebar-item active px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-chart-line w-5"></i> Dashboard
                </div>
                <div onclick="navTo('itinerary')" id="btn-itinerary" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-calendar-check w-5"></i> Itinerary
                </div>
                <div onclick="navTo('roomlist')" id="btn-roomlist" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-bed w-5"></i> Roomlist
                </div>
                <div onclick="navTo('pesanan')" id="btn-pesanan" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-bell-concierge w-5"></i> Pesanan
                </div>
                <div onclick="navTo('jamaah')" id="btn-jamaah" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-users-viewfinder w-5"></i> Data Jamaah
                </div>
                <!-- MENU YANG DIMUNCULKAN KEMBALI -->
                <div onclick="navTo('perlengkapan')" id="btn-perlengkapan" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-box-archive w-5"></i> Perlengkapan
                </div>
                <div onclick="navTo('catatan')" id="btn-catatan" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-note-sticky w-5"></i> Catatan
                </div>
            </nav>
        </div>
    </aside>

    <!-- CONTENT AREA -->
    <div class="flex-1 lg:ml-72 flex flex-col min-h-screen">
        <header class="h-20 bg-white/80 backdrop-blur-md border-b sticky top-0 z-40 flex items-center justify-between px-6">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="lg:hidden w-10 h-10 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center">
                    <i class="fa-solid fa-bars-staggered"></i>
                </button>
                <h2 id="page-title" class="font-bold text-slate-800 uppercase tracking-widest text-[10px] md:text-sm">Dashboard</h2>
            </div>
            <div id="sync-icon" class="hidden"><i class="fa-solid fa-rotate fa-spin text-emerald-600"></i></div>
        </header>

        <main id="content-render" class="p-4 md:p-8 transition-all duration-300">
            <!-- Content Injected Here -->
        </main>
    </div>

    <!-- MODAL -->
    <div id="modal" class="fixed inset-0 z-[100] hidden modal-bg flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-[2rem] shadow-2xl overflow-hidden animate-reveal">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-slate-800 uppercase text-sm tracking-widest">Tambah Data</h3>
                <button onclick="closeModal()" class="text-slate-300 hover:text-red-500 transition-colors"><i class="fa-solid fa-circle-xmark text-2xl"></i></button>
            </div>
            <form id="modal-form" class="p-6 space-y-4">
                <div id="form-fields" class="space-y-4"></div>
                <button type="submit" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-emerald-100 hover:bg-emerald-700 transition-all mt-4">Simpan Data</button>
            </form>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw3t4ld9deKYGr7OANyiinlCDR9WJqjaQ5NIrxUy7D2faUS8IGBdXlkRhW5E-LtQ_8e/exec';
        let currentPage = 'dashboard';

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('global-loader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('global-loader').style.display = 'none';
                    navTo('dashboard');
                }, 500);
            }, 1000);
        };

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function navTo(page) {
            currentPage = page;
            document.getElementById('page-title').innerText = page;
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`btn-${page}`).classList.add('active');

            if (window.innerWidth < 1024) toggleSidebar();
            loadData();
        }

        async function loadData() {
            const container = document.getElementById('content-render');
            const syncIcon = document.getElementById('sync-icon');
            syncIcon.classList.remove('hidden');
            
            try {
                const action = 'get' + currentPage.charAt(0).toUpperCase() + currentPage.slice(1);
                const res = await fetch(`${SCRIPT_URL}?action=${action}`);
                const data = await res.json();
                renderPage(data);
            } catch (e) {
                container.innerHTML = `<div class="text-center p-20 text-slate-400">Gagal memuat data dari sheet ${currentPage}.</div>`;
            } finally {
                syncIcon.classList.add('hidden');
            }
        }

        function renderPage(data) {
            const container = document.getElementById('content-render');
            let html = `<div class="flex justify-between items-center mb-6">
                            <h1 class="text-xl font-bold text-slate-800 capitalize">${currentPage}</h1>
                            ${currentPage !== 'dashboard' ? `<button onclick="openModal('add')" class="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs shadow-lg shadow-emerald-100 flex items-center gap-2 hover:bg-emerald-700 transition-all"><i class="fa-solid fa-plus"></i> Tambah</button>` : ''}
                        </div>`;

            if (currentPage === 'dashboard') {
                html += `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div class="bg-emerald-900 p-8 rounded-[2rem] text-white col-span-1 md:col-span-2 relative overflow-hidden shadow-xl shadow-emerald-100">
                        <i class="fa-solid fa-kaaba absolute right-[-5%] bottom-[-5%] text-[8rem] opacity-10"></i>
                        <h3 class="text-[10px] font-bold opacity-60 uppercase tracking-[0.2em] mb-2">Manajemen Haji 2026</h3>
                        <p class="text-3xl font-bold">Layanan Sektor Aktif</p>
                    </div>
                    <div class="glass-card p-8 rounded-[2rem] flex flex-col justify-center items-center text-center">
                        <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mb-3"><i class="fa-solid fa-users"></i></div>
                        <h3 class="text-slate-400 font-bold text-[10px] uppercase mb-1">Total Jamaah</h3>
                        <p class="text-2xl font-bold text-slate-800">120 Pax</p>
                    </div>
                </div>`;
            } else {
                html += `<div class="glass-card rounded-[2rem] overflow-hidden overflow-x-auto shadow-sm">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 text-[10px] uppercase font-bold text-slate-400 tracking-widest border-b">
                                    <tr>${getHeaders().map(h => `<th class="px-6 py-4">${h}</th>`).join('')}<th class="px-6 py-4 text-center">Aksi</th></tr>
                                </thead>
                                <tbody class="divide-y">
                                    ${data.length === 0 ? `<tr><td colspan="10" class="p-10 text-center text-slate-300">Data belum tersedia</td></tr>` : 
                                    data.map(item => `
                                        <tr class="hover:bg-slate-50/50 transition-colors">
                                            ${getHeaders().map(h => `<td class="px-6 py-4 text-sm font-semibold text-slate-700">${item[h.toLowerCase().replace(' ','_')] || '-'}</td>`).join('')}
                                            <td class="px-6 py-4 flex justify-center gap-2">
                                                <button onclick='openModal("edit", ${JSON.stringify(item).replace(/'/g, "&apos;")})' class="text-amber-500 hover:bg-amber-50 w-8 h-8 rounded-lg transition-all"><i class="fa-solid fa-pen-to-square"></i></button>
                                                <button onclick="deleteData('${item.id}')" class="text-red-400 hover:bg-red-50 w-8 h-8 rounded-lg transition-all"><i class="fa-solid fa-trash"></i></button>
                                            </td>
                                        </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>`;
            }
            container.innerHTML = html;
        }

        function getHeaders() {
            const headers = {
                itinerary: ['Waktu Saudi', 'Kegiatan'],
                roomlist: ['No Kamar', 'Nama Lengkap', 'Tipe Kamar'],
                pesanan: ['No Kamar', 'Nama Barang', 'Qty', 'Status Pesanan'],
                jamaah: ['Nama Lengkap', 'No Paspor', 'Paket Haji'],
                perlengkapan: ['Nama Barang', 'Jumlah', 'Status'],
                catatan: ['Judul', 'Isi Catatan', 'Petugas']
            };
            return headers[currentPage] || [];
        }

        function openModal(type, data = null) {
            const fields = document.getElementById('form-fields');
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal-title').innerText = type === 'add' ? `Tambah ${currentPage}` : `Edit ${currentPage}`;
            
            fields.innerHTML = '';
            getHeaders().forEach(h => {
                const key = h.toLowerCase().replace(' ', '_');
                fields.innerHTML += `
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-2 tracking-widest">${h}</label>
                        <input type="text" name="${key}" value="${data ? data[key] : ''}" required class="w-full bg-slate-50 border border-slate-100 p-4 rounded-xl outline-none focus:border-emerald-500 font-bold text-slate-700 mt-1">
                    </div>`;
            });
            if(data) fields.innerHTML += `<input type="hidden" name="id" value="${data.id}">`;
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        document.getElementById('modal-form').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.action = data.id ? 'updateData' : 'addData';
            data.sheet = currentPage;

            closeModal();
            document.getElementById('sync-icon').classList.remove('hidden');
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: new URLSearchParams(data) });
                loadData();
            } catch(e) { alert('Terjadi kesalahan saat menyimpan'); }
        };

        async function deleteData(id) {
            if(!confirm('Hapus data ini secara permanen?')) return;
            document.getElementById('sync-icon').classList.remove('hidden');
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: new URLSearchParams({ action: 'deleteData', id: id, sheet: currentPage }) });
                loadData();
            } catch(e) { alert('Gagal menghapus data'); }
        }
    </script>
</body>
</html>
