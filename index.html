<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handling Haji Pro - Jejak Imani</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .sidebar-item { transition: all 0.2s ease; color: #64748b; font-weight: 500; cursor: pointer; }
        .sidebar-item.active { background-color: #ecfdf5; color: #059669; font-weight: 700; border-right: 4px solid #059669; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        tr.clickable { cursor: pointer; transition: background 0.2s; }
        tr.clickable:hover { background-color: #f1f5f9; }
        .modal-detail { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="min-h-screen flex" onload="navTo('dashboard')">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white shadow-2xl transition-all duration-300 border-r border-slate-100">
        <div class="flex flex-col h-full">
            <div class="p-8 flex justify-between items-center border-b border-slate-50">
                <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="w-28">
                <button onclick="toggleSidebar()" class="text-slate-400 p-2 lg:hidden"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                <div onclick="navTo('dashboard')" id="btn-dashboard" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-house-chimney w-5"></i> Dashboard
                </div>
                <div onclick="navTo('itinerary')" id="btn-itinerary" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-route w-5"></i> Itinerary
                </div>
                <div onclick="navTo('roomlist')" id="btn-roomlist" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-hotel w-5"></i> Roomlist
                </div>
                <div onclick="navTo('pesanan')" id="btn-pesanan" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-bell-concierge w-5"></i> Pesanan
                </div>
                <div onclick="navTo('jamaah')" id="btn-jamaah" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-user-group w-5"></i> Data Jamaah
                </div>
                <div onclick="navTo('perlengkapan')" id="btn-perlengkapan" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-boxes-packing w-5"></i> Perlengkapan
                </div>
                <div onclick="navTo('catatan')" id="btn-catatan" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-note-sticky w-5"></i> Catatan
                </div>
            </nav>
        </div>
    </aside>

    <!-- CONTENT AREA -->
    <div id="main-content" class="flex-1 lg:ml-72 flex flex-col min-h-screen transition-all duration-300">
        <header class="h-20 bg-white/80 backdrop-blur-md border-b sticky top-0 z-40 flex items-center justify-between px-6">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center">
                    <i class="fa-solid fa-bars-staggered"></i>
                </button>
                <h2 id="page-title" class="font-bold text-slate-800 uppercase tracking-widest text-xs">Dashboard</h2>
            </div>
            <div class="flex items-center gap-4">
                <div id="sync-icon" class="hidden"><i class="fa-solid fa-rotate fa-spin text-emerald-600"></i></div>
                <div class="text-right hidden sm:block">
                    <p id="live-clock" class="text-sm font-bold text-slate-800">00:00:00</p>
                    <p id="hijri-date" class="text-[10px] text-emerald-600 font-bold uppercase italic italic">Loading...</p>
                </div>
            </div>
        </header>

        <main id="content-render" class="p-4 md:p-8">
            <!-- Content Injected Here -->
        </main>
    </div>

    <!-- MODAL DETAIL -->
    <div id="modal-detail" class="fixed inset-0 z-[110] hidden modal-detail flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-[2rem] shadow-2xl overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800">Detail Informasi</h3>
                <button onclick="closeDetail()" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-circle-xmark text-2xl"></i></button>
            </div>
            <div id="detail-content" class="p-8 space-y-4 max-h-[70vh] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwHKkh0c4LMt_ZkFSGc-sGRbVsK_wkEWAjbOlMLUkulLyM1mOQ9vriOhX3KRRg985rN/exec'; // Ganti dengan URL Deployment Anda
        let fullData = [];
        let dashboardData = { catatan: [] };

        function updateTime() {
            const now = new Date();
            const saudiTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Riyadh"}));
            document.getElementById('live-clock').innerText = saudiTime.toLocaleTimeString('id-ID', { hour12: false });
            const options = { day: 'numeric', month: 'long', year: 'numeric', calendar: 'islamic-uma' };
            document.getElementById('hijri-date').innerText = new Intl.DateTimeFormat('id-ID-u-ca-islamic-uma', options).format(now);
        }
        setInterval(updateTime, 1000);

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        async function navTo(page) {
            document.getElementById('page-title').innerText = page;
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`btn-${page}`).classList.add('active');
            await loadData(page);
        }

        async function loadData(page) {
            const container = document.getElementById('content-render');
            document.getElementById('sync-icon').classList.remove('hidden');
            try {
                const action = page === 'dashboard' ? 'getDashboard' : `get${page.charAt(0).toUpperCase() + page.slice(1)}`;
                const res = await fetch(`${SCRIPT_URL}?action=${action}`);
                fullData = await res.json();
                renderContent(page, fullData);
            } catch (e) {
                container.innerHTML = `<p class="text-center p-10 text-slate-400">Gagal memuat data.</p>`;
            } finally {
                document.getElementById('sync-icon').classList.add('hidden');
            }
        }

        function renderContent(page, data) {
            const container = document.getElementById('content-render');
            let html = '';

            // Search Bar Universal
            if(['jamaah', 'roomlist', 'perlengkapan', 'itinerary', 'catatan'].includes(page)) {
                html += `
                <div class="mb-6"><div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-300"></i>
                    <input type="text" onkeyup="searchData(this.value, '${page}')" placeholder="Cari di ${page}..." class="w-full pl-12 pr-4 py-3 rounded-2xl border-none ring-1 ring-slate-200 focus:ring-emerald-500 outline-none shadow-sm">
                </div></div>`;
            }

            if(page === 'dashboard') {
                html = renderDashboard(data);
            } else if(page === 'jamaah') {
                html += renderTable(data, ['kode_ji', 'nama_lengkap', 'bus', 'no_paspor'], 'jamaah');
            } else if(page === 'roomlist') {
                html += renderTable(data, ['no_kamar', 'nama_jamaah', 'tipe_kamar', 'hotel'], 'roomlist');
            } else if(page === 'perlengkapan') {
                html += renderTable(data, ['item', 'jumlah', 'status_distribusi'], 'perlengkapan');
            } else if(page === 'itinerary') {
                html += renderTable(data, ['waktu_saudi', 'kegiatan', 'lokasi'], 'itinerary');
            } else if(page === 'pesanan') {
                html += renderPesananModule(data);
            } else if(page === 'catatan') {
                html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="table-body">
                    ${data.map(c => `<div class="glass-card p-6 rounded-3xl border-l-4 border-yellow-400">
                        <h4 class="font-bold text-slate-800 mb-2">${c.judul || 'Note'}</h4>
                        <p class="text-sm text-slate-600">${c.isi || ''}</p>
                    </div>`).join('')}
                </div>`;
            }

            container.innerHTML = html;
        }

        function renderTable(data, cols, type) {
            return `<div class="glass-card rounded-[2rem] table-container"><table class="w-full text-left">
                <thead class="bg-slate-50 text-[10px] font-bold text-slate-400 uppercase border-b">
                    <tr>${cols.map(c => `<th class="px-6 py-4">${c.replace('_',' ')}</th>`).join('')}</tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-50">
                    ${data.map(item => `<tr class="clickable" onclick='showDetail("${type}", ${JSON.stringify(item)})'>
                        ${cols.map(c => `<td class="px-6 py-4 text-sm">${item[c] || '-'}</td>`).join('')}
                    </tr>`).join('')}
                </tbody>
            </table></div>`;
        }

        function renderPesananModule(data) {
            return `
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-1 glass-card p-6 rounded-3xl h-fit">
                    <h3 class="font-bold mb-4">Input Pesanan Baru</h3>
                    <div class="space-y-3">
                        <input id="p_kamar" type="text" placeholder="No Kamar" class="w-full p-3 rounded-xl border">
                        <input id="p_barang" type="text" placeholder="Nama Barang" class="w-full p-3 rounded-xl border">
                        <input id="p_qty" type="number" placeholder="Jumlah" class="w-full p-3 rounded-xl border">
                        <button onclick="submitPesanan()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold">Kirim Pesanan</button>
                    </div>
                </div>
                <div class="lg:col-span-2 glass-card p-6 rounded-3xl">
                    <h3 class="font-bold mb-4">Daftar Pesanan</h3>
                    <div class="space-y-3" id="pesanan-list">
                        ${data.map(p => `
                            <div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl">
                                <div>
                                    <p class="font-bold text-sm">Room ${p.no_kamar} - ${p.nama_barang} (${p.qty})</p>
                                    <p class="text-[10px] text-slate-400">${p.waktu} | Status: <span class="text-emerald-600 font-bold">${p.status}</span></p>
                                </div>
                                ${p.status !== 'Selesai' ? `<button onclick="updateStatus('${p.id}', 'Selesai')" class="text-xs bg-white border px-3 py-1 rounded-lg">Selesaikan</button>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>`;
        }

        async function submitPesanan() {
            const payload = {
                action: 'addPesanan',
                no_kamar: document.getElementById('p_kamar').value,
                nama_barang: document.getElementById('p_barang').value,
                qty: document.getElementById('p_qty').value
            };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            navTo('pesanan');
        }

        async function updateStatus(id, status) {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'updateStatusPesanan', id, status }) });
            navTo('pesanan');
        }

        function renderDashboard(data) {
            return `
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-emerald-900 p-8 rounded-[2.5rem] text-white shadow-2xl relative overflow-hidden">
                        <i class="fa-solid fa-kaaba absolute right-[-5%] bottom-[-5%] text-[10rem] opacity-10"></i>
                        <h3 class="text-xs font-bold text-emerald-400 uppercase mb-1">Status Terkini</h3>
                        <p class="text-xl font-bold mb-4">Handling Jamaah Haji Jejak Imani</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="glass-card p-6 rounded-3xl">
                            <h4 class="text-xs font-bold text-slate-400 uppercase mb-4">🛎️ Pesanan Aktif</h4>
                            <div class="text-2xl font-bold text-emerald-600">${data.pesanan ? data.pesanan.length : 0} Pesanan</div>
                        </div>
                        <div class="glass-card p-6 rounded-3xl">
                             <h4 class="text-xs font-bold text-slate-400 uppercase mb-2">🕌 Jadwal Sholat</h4>
                             <p class="text-[10px] text-slate-400 italic">Mekkah & Madinah</p>
                        </div>
                    </div>
                </div>
                <div onclick="navTo('catatan')" class="glass-card p-8 rounded-[2.5rem] border-t-8 border-emerald-600 cursor-pointer">
                    <h3 class="font-bold text-slate-800 mb-6"><i class="fa-solid fa-pen-nib text-emerald-600"></i> Catatan</h3>
                    <div class="space-y-4">
                        ${data.catatan ? data.catatan.map(n => `
                            <div class="p-4 bg-slate-50 rounded-2xl border-l-4 border-emerald-400">
                                <h5 class="text-xs font-bold mb-1">${n.judul}</h5>
                                <p class="text-[11px] text-slate-600 truncate">${n.isi}</p>
                            </div>`).join('') : ''}
                    </div>
                </div>
            </div>`;
        }

        function showDetail(type, item) {
            const modal = document.getElementById('modal-detail');
            const content = document.getElementById('detail-content');
            modal.classList.remove('hidden');
            let html = `<div class="space-y-4">`;
            for (let key in item) {
                html += `<div><p class="text-[10px] text-slate-400 font-bold uppercase">${key.replace('_',' ')}</p><p class="font-bold text-slate-700">${item[key]}</p></div>`;
            }
            html += `</div>`;
            content.innerHTML = html;
        }

        function closeDetail() { document.getElementById('modal-detail').classList.add('hidden'); }

        function searchData(query, page) {
            const q = query.toLowerCase();
            const filtered = fullData.filter(item => Object.values(item).some(val => String(val).toLowerCase().includes(q)));
            const tableBody = document.getElementById('table-body');
            
            if (page === 'catatan') {
                renderContent('catatan', filtered);
            } else {
                // Re-render rows table
                const rows = filtered.map(item => `<tr class="clickable" onclick='showDetail("${page}", ${JSON.stringify(item)})'>
                    ${Object.values(item).map(v => `<td class="px-6 py-4 text-sm">${v}</td>`).join('')}
                </tr>`).join('');
                tableBody.innerHTML = rows || '<tr><td colspan="10" class="p-10 text-center">Data tidak ditemukan</td></tr>';
            }
        }
    </script>
</body>
</html>
