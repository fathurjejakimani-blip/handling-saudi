<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handling Haji 2026 - Jejak Imani</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Martel:wght@700&family=Mulish:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Mulish', sans-serif; }
        h1, h2, h3 { font-family: 'Martel', serif; }
        .bg-custom { 
            background-image: url('https://drive.google.com/uc?export=view&id=1S04aXsEdKJ1qAKSNnDNwkzQU5drK2MlP');
            background-size: cover;
            background-attachment: fixed;
        }
        #welcome-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
    </style>
</head>
<body class="bg-custom text-slate-800">

    <!-- Welcome Screen -->
    <div id="welcome-screen" class="bg-custom">
        <div class="bg-white/80 p-10 rounded-full animate-pulse">
            <img src="https://drive.google.com/uc?export=view&id=1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" alt="Logo" class="w-40">
        </div>
    </div>

    <!-- Main Layout -->
    <div id="main-app" class="hidden flex min-h-screen">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out">
            <div class="p-6">
                <img src="https://drive.google.com/uc?export=view&id=1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="w-20 mb-6">
                <nav class="space-y-2">
                    <button onclick="showPage('dashboard')" class="w-full text-left p-3 hover:bg-gold-50 rounded">Dashboard</button>
                    <button onclick="showPage('itinerary')" class="w-full text-left p-3 hover:bg-gold-50 rounded">Itinerary</button>
                    <button onclick="showPage('roomlist')" class="w-full text-left p-3 hover:bg-gold-50 rounded">Roomlist</button>
                    <button onclick="showPage('perlengkapan')" class="w-full text-left p-3 hover:bg-gold-50 rounded">Perlengkapan</button>
                    <button onclick="showPage('pesanan')" class="w-full text-left p-3 hover:bg-gold-50 rounded">Pesanan</button>
                    <button onclick="showPage('jamaah')" class="w-full text-left p-3 hover:bg-gold-50 rounded">Data Jamaah</button>
                    <button onclick="showPage('catatan')" class="w-full text-left p-3 hover:bg-gold-50 rounded">Catatan</button>
                </nav>
            </div>
            <button onclick="toggleSidebar()" class="absolute top-4 right-[-40px] bg-white p-2 rounded-r shadow-md">X</button>
        </aside>

        <!-- Content Area -->
        <main class="flex-1 p-4 md:p-8">
            <header class="flex justify-between items-center mb-8 bg-white/90 p-4 rounded-xl shadow-sm">
                <button onclick="toggleSidebar()" class="text-2xl">☰</button>
                <h2 id="page-title" class="text-xl font-bold">Dashboard</h2>
                <div class="w-10"></div>
            </header>

            <div id="content-render" class="bg-white/90 p-6 rounded-2xl shadow-lg min-h-[70vh]">
                <!-- Konten dinamis akan dimuat di sini -->
            </div>
        </main>
    </div>

    <script>
        // Logika Transisi Welcome Screen
        window.onload = () => {
            setTimeout(() => {
                const welcome = document.getElementById('welcome-screen');
                const mainApp = document.getElementById('main-app');
                welcome.style.opacity = '0';
                setTimeout(() => {
                    welcome.style.display = 'none';
                    mainApp.classList.remove('hidden');
                }, 800);
            }, 2000);
        };

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('-translate-x-full');
        }

        function showPage(page) {
            document.getElementById('page-title').innerText = page.toUpperCase();
            document.getElementById('sidebar').classList.add('-translate-x-full'); // Auto hide
            // Logic fetch data akan di Part 3
        }

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzQbna4hGq17tZtzsac7DyTBfoLu4uZ5voegPTjQnnvrBuSB5aoPlJBzCRLZdDPDEud/exec'; // Ganti dengan URL dari Part 1

// Objek untuk menyimpan data secara lokal agar tidak perlu loading ulang (Cache)
let appData = {
    dashboard: null,
    itinerary: [],
    roomlist: [],
    jamaah: []
};

// 1. Inisialisasi Aplikasi
window.onload = () => {
    // Efek Welcome Screen
    setTimeout(() => {
        const welcome = document.getElementById('welcome-screen');
        const mainApp = document.getElementById('main-app');
        welcome.style.opacity = '0';
        setTimeout(() => {
            welcome.style.display = 'none';
            mainApp.classList.remove('hidden');
            loadDashboard(); // Muat Dashboard pertama kali
        }, 800);
    }, 2000);
};

// 2. Fungsi Toggle Sidebar
function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    sb.classList.toggle('-translate-x-full');
}

// 3. Fungsi Load Dashboard (Data Dinamis)
async function loadDashboard() {
    renderLoading();
    try {
        const response = await fetch(`${SCRIPT_URL}?action=getDashboard`);
        const data = await response.json();
        appData.dashboard = data;
        renderDashboard(data);
    } catch (error) {
        console.error("Gagal memuat data:", error);
        document.getElementById('content-render').innerHTML = `<p class="text-red-500">Gagal memuat data. Pastikan URL Apps Script benar.</p>`;
    }
}

// 4. Render Tampilan Dashboard
function renderDashboard(data) {
    const now = new Date();
    const tglMasehi = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    
    // Simulasi Waktu Saudi (Masehi - 4 Jam)
    const saudiTime = new Date(now.getTime() - (4 * 60 * 60 * 1000));
    
    let html = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Card Waktu -->
            <div class="bg-gradient-to-br from-green-700 to-green-900 text-white p-6 rounded-2xl shadow-md">
                <h3 class="text-sm opacity-80 uppercase tracking-wider">Waktu & Tanggal</h3>
                <p class="text-2xl font-bold mt-2">${tglMasehi}</p>
                <p class="text-md opacity-90 italic mt-1">Saudi: ${saudiTime.toLocaleTimeString('id-ID')} AST</p>
            </div>

            <!-- Jadwal Sholat (Placeholder API) -->
            <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                <h3 class="text-green-800 font-bold mb-4 flex items-center">
                    <span class="mr-2">🕌</span> Jadwal Sholat (Makkah)
                </h3>
                <div class="grid grid-cols-5 gap-2 text-center text-xs font-semibold">
                    <div class="p-2 bg-gray-50 rounded">Subuh<br>04:50</div>
                    <div class="p-2 bg-gray-50 rounded">Dzuhur<br>12:20</div>
                    <div class="p-2 bg-gray-50 rounded">Ashar<br>15:40</div>
                    <div class="p-2 bg-gray-50 rounded">Maghrib<br>18:45</div>
                    <div class="p-2 bg-gray-50 rounded">Isya<br>20:15</div>
                </div>
            </div>

            <!-- Schedule Hari Ini -->
            <div class="col-span-1 md:col-span-2 bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                <h3 class="text-green-800 font-bold mb-4">📅 Itinerary Hari Ini</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="border-b">
                                <th class="pb-2">Waktu (KSA)</th>
                                <th class="pb-2">Kegiatan</th>
                                <th class="pb-2">Lokasi</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.itinerary.length > 0 ? data.itinerary.map(item => `
                                <tr class="border-b last:border-0">
                                    <td class="py-3 font-bold text-green-700">${item.waktu_saudi}</td>
                                    <td class="py-3">${item.kegiatan}</td>
                                    <td class="py-3 text-gray-500">${item.lokasi}</td>
                                </tr>
                            `).join('') : '<tr><td colspan="3" class="py-4 text-center text-gray-400">Tidak ada agenda hari ini</td></tr>'}
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Catatan Hari Ini -->
            <div class="col-span-1 md:col-span-2 bg-yellow-50 p-6 rounded-2xl border border-yellow-200">
                <h3 class="text-yellow-800 font-bold mb-2">📌 Catatan Tim</h3>
                <p class="text-gray-700">${data.catatan[0]?.isi_catatan || 'Belum ada catatan untuk hari ini.'}</p>
            </div>
        </div>
    `;
    document.getElementById('content-render').innerHTML = html;
}

// 5. Fungsi Navigasi Menu
async function showPage(page) {
    document.getElementById('page-title').innerText = page.replace(/^\w/, c => c.toUpperCase());
    toggleSidebar(); // Tutup sidebar otomatis
    renderLoading();

    try {
        const action = 'get' + page.charAt(0).toUpperCase() + page.slice(1);
        const response = await fetch(`${SCRIPT_URL}?action=${action}`);
        const data = await response.json();
        
        if(page === 'itinerary') renderItinerary(data);
        if(page === 'roomlist') renderRoomlist(data);
        if(page === 'jamaah') renderJamaah(data);
        if(page === 'dashboard') loadDashboard();
        // Menu lainnya menyusul...
    } catch (e) {
        console.error(e);
    }
}

function renderLoading() {
    document.getElementById('content-render').innerHTML = `
        <div class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-green-700"></div>
            <p class="mt-4 text-gray-500">Mengambil data dari server...</p>
        </div>
    `;
}

function renderItinerary(data) {
    let html = `
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold">Jadwal Kegiatan</h3>
            <button class="bg-green-700 text-white px-4 py-2 rounded-lg text-sm">+ Tambah</button>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="p-3 text-left">Waktu KSA</th>
                        <th class="p-3 text-left">Waktu WIB</th>
                        <th class="p-3 text-left">Kegiatan</th>
                        <th class="p-3 text-left">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    ${data.map(item => `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-3 font-bold">${item.waktu_saudi}</td>
                            <td class="p-3 text-gray-500">${item.waktu_wib}</td>
                            <td class="p-3">${item.kegiatan}</td>
                            <td class="p-3">
                                <button class="text-blue-600 mr-2">Edit</button>
                                <button class="text-red-600">Hapus</button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
    `;
    document.getElementById('content-render').innerHTML = html;
}

function renderRoomlist(data) {
    // Filter berdasarkan kategori (Makkah/Madinah/Transit)
    const makkah = data.filter(r => r.kategori_hotel === 'Makkah');
    
    let html = `
        <div class="mb-6 flex gap-2 overflow-x-auto pb-2">
            <button class="bg-green-700 text-white px-4 py-2 rounded-full text-xs">Hotel Makkah</button>
            <button class="bg-gray-200 px-4 py-2 rounded-full text-xs">Hotel Madinah</button>
            <button class="bg-gray-200 px-4 py-2 rounded-full text-xs">Transit</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${makkah.map(room => `
                <div class="bg-white border p-4 rounded-xl shadow-sm hover:shadow-md cursor-pointer" onclick="viewRoomDetail('${room.id}')">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs text-gray-500">Kamar ${room.no_kamar} (${room.tipe_kamar})</p>
                            <p class="font-bold text-lg">Roomlist #${room.no_roomlist}</p>
                        </div>
                        <span class="bg-blue-100 text-blue-800 text-[10px] px-2 py-1 rounded">Detail ></span>
                    </div>
                    <div class="mt-3 text-xs text-gray-600">
                        <p>ID Jamaah: ${room.id_jamaah}</p>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
    document.getElementById('content-render').innerHTML = html;
}

function renderJamaah(data) {
    let html = `
        <div class="space-y-4">
            <!-- Search Bar -->
            <div class="relative">
                <input type="text" id="searchJamaah" onkeyup="filterJamaah()" 
                    placeholder="Cari Nama atau No. Paspor..." 
                    class="w-full p-4 rounded-xl border border-gray-200 shadow-sm focus:ring-2 focus:ring-green-500 outline-none">
            </div>

            <div class="overflow-x-auto bg-white rounded-xl">
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-50 text-gray-600">
                        <tr>
                            <th class="p-4">Nama Lengkap</th>
                            <th class="p-4">No. Paspor</th>
                            <th class="p-4">Paket</th>
                            <th class="p-4">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-jamaah">
                        ${data.map(j => `
                            <tr class="border-b hover:bg-green-50 transition">
                                <td class="p-4 font-semibold">${j.nama_lengkap}</td>
                                <td class="p-4">${j.no_paspor}</td>
                                <td class="p-4"><span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs">${j.paket_haji}</span></td>
                                <td class="p-4">
                                    <button onclick="showDetailJamaah('${j.id}')" class="text-green-700 font-bold">Detail</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    `;
    document.getElementById('content-render').innerHTML = html;
}

// Fungsi Pencarian Cepat (Client-side)
function filterJamaah() {
    let input = document.getElementById('searchJamaah').value.toUpperCase();
    let rows = document.querySelectorAll('#tabel-jamaah tr');
    
    rows.forEach(row => {
        let text = row.innerText.toUpperCase();
        row.style.display = text.includes(input) ? "" : "none";
    });
}

function renderPesanan(data) {
    let html = `
        <div class="grid grid-cols-1 gap-4">
            ${data.map(p => `
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 ${p.status_pesanan === 'Pending' ? 'border-red-500' : 'border-yellow-500'} flex justify-between items-center">
                    <div>
                        <p class="text-xs text-gray-500">${p.waktu_order}</p>
                        <h4 class="font-bold text-lg">Kamar ${p.no_kamar} - ${p.nama_barang}</h4>
                        <p class="text-sm">Jumlah: <span class="font-bold">${p.qty}</span></p>
                    </div>
                    <div class="text-right">
                        <select onchange="updateStatusPesanan('${p.id}', this.value)" class="p-2 rounded bg-gray-100 text-sm">
                            <option value="Pending" ${p.status_pesanan === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Proses" ${p.status_pesanan === 'Proses' ? 'selected' : ''}>Proses</option>
                            <option value="Selesai">Selesai (Hapus)</option>
                        </select>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
    document.getElementById('content-render').innerHTML = html || '<p class="text-center py-10 text-gray-400">Tidak ada pesanan logistik saat ini.</p>';
}

    </script>
</body>
</html>
