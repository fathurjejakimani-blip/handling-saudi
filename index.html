<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Handling Haji 2026 - Jejak Imani</title>
    
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700&family=Martel:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --ji-primary: #0f172a;
            --ji-accent: #059669;
            --ji-gold: #d4af37;
        }

        body { 
            font-family: 'Mulish', sans-serif; 
            background: url('https://lh3.googleusercontent.com/d/1S04aXsEdKJ1qAKSNnDNwkzQU5drK2MlP') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            overflow-x: hidden;
        }

        h1, h2, h3, .font-martel { font-family: 'Martel', serif; }

        /* WELCOME SCREEN */
        #welcome-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease-out;
        }
        
        .logo-anim {
            width: 200px;
            animation: pulse-logo 2s infinite ease-in-out;
        }

        @keyframes pulse-logo {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        /* SIDEBAR CUSTOM */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
            z-index: 50;
        }
        
        .sidebar.closed { transform: translateX(-100%); }
        
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            margin: 4px 12px;
            border-radius: 12px;
            color: var(--ji-primary);
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background: #f1f5f9;
            color: var(--ji-accent);
        }

        /* GLASS CARD */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* FLOATING BUTTON */
        .btn-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--ji-accent);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 10px 25px rgba(5, 150, 105, 0.4);
            cursor: pointer;
            z-index: 100;
            transition: transform 0.3s;
        }
        .btn-float:hover { transform: scale(1.1) rotate(90deg); }

        .loading-overlay {
            position: fixed;
            top: 20px;
            right: 20px;
            display: none;
            background: white;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        @keyframes slide-up {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slide-up 0.3s ease-out;
        }
    </style>
</head>
<body>

    <!-- 1. WELCOME SCREEN -->
    <div id="welcome-screen">
        <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="logo-anim" alt="Logo Jejak Imani">
        <p class="mt-4 font-martel font-bold text-slate-800 tracking-widest uppercase text-sm">Sistem Handling Haji 2026</p>
    </div>

    <!-- 2. LOADING INDICATOR -->
    <div id="loading" class="loading-overlay z-[100] items-center gap-2 flex">
        <i class="fas fa-spinner fa-spin text-emerald-600"></i>
        <span class="text-xs font-bold text-slate-600">Sinkronisasi...</span>
    </div>

    <!-- 3. SIDEBAR -->
    <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 shadow-2xl border-r">
        <div class="p-6 flex justify-between items-center border-b">
            <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="w-24">
            <button onclick="toggleSidebar()" class="lg:hidden text-slate-400"><i class="fas fa-times-circle text-2xl"></i></button>
        </div>
        <nav class="mt-6 space-y-1">
            <div onclick="navTo('dashboard')" id="nav-dashboard" class="sidebar-item active"><i class="fas fa-th-large w-6"></i> Dashboard</div>
            <div onclick="navTo('itinerary')" id="nav-itinerary" class="sidebar-item"><i class="fas fa-map-marked-alt w-6"></i> Itinerary</div>
            <div onclick="navTo('roomlist')" id="nav-roomlist" class="sidebar-item"><i class="fas fa-hotel w-6"></i> Roomlist</div>
            <div onclick="navTo('perlengkapan')" id="nav-perlengkapan" class="sidebar-item"><i class="fas fa-boxes w-6"></i> Perlengkapan</div>
            <div onclick="navTo('pesanan')" id="nav-pesanan" class="sidebar-item"><i class="fas fa-bell-concierge w-6"></i> Pesanan</div>
            <div onclick="navTo('jamaah')" id="nav-jamaah" class="sidebar-item"><i class="fas fa-users w-6"></i> Data Jamaah</div>
            <div onclick="navTo('catatan')" id="nav-catatan" class="sidebar-item"><i class="fas fa-sticky-note w-6"></i> Catatan</div>
        </nav>
    </aside>

    <!-- 4. MAIN CONTENT -->
    <main id="main-area" class="lg:ml-[280px] min-h-screen transition-all duration-300">
        <header class="h-20 flex items-center justify-between px-8 bg-white/60 backdrop-blur-md sticky top-0 z-40 border-b">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="w-10 h-10 bg-emerald-600 text-white rounded-lg flex items-center justify-center">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 id="page-title" class="text-lg font-bold text-slate-800 uppercase tracking-tighter">Dashboard</h1>
            </div>
            <div id="header-time" class="text-right">
                <p id="live-clock" class="font-bold text-emerald-700 leading-tight">00:00:00</p>
                <p id="live-date" class="text-[10px] uppercase font-bold text-slate-500">Loading...</p>
            </div>
        </header>

        <div id="content" class="p-6 pb-24">
            <!-- Dynamic Content Here -->
        </div>

        <div id="floating-action"></div>
    </main>

    <!-- 5. MODAL POPUP -->
    <div id="modal" class="fixed inset-0 z-[110] hidden bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden animate-slide-up">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <h3 id="modal-title" class="font-bold text-slate-800 uppercase">Detail</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-red-500"><i class="fas fa-times-circle text-2xl"></i></button>
            </div>
            <div id="modal-body" class="p-6 max-h-[80vh] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycby8UYTQpoF_TNIskWUBa8ntfUrlePBMD9qD4ujsASWhS0aP11K925hQiaCPj436ZTc4/exec';
        let currentData = JSON.parse(localStorage.getItem('haji_cache')) || {};
        let prayTimes = null;

        window.addEventListener('load', () => {
            setTimeout(() => {
                const ws = document.getElementById('welcome-screen');
                if(ws) ws.style.opacity = '0';
                setTimeout(() => ws ? ws.remove() : null, 1000);
            }, 1500);
            
            fetchPrayTimes();
            updateClock();
            setInterval(updateClock, 1000);
            navTo('dashboard');
        });

        // 1. CLOCK & HIJRI (FIXED DATE LOGIC)
        function updateClock() {
            const now = new Date();
            const optionsTime = { timeZone: "Asia/Riyadh", hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('live-clock').innerText = new Intl.DateTimeFormat('id-ID', optionsTime).format(now);
            
            const optionsMasehi = { timeZone: "Asia/Riyadh", weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const masehi = new Intl.DateTimeFormat('id-ID', optionsMasehi).format(now);
            
            const optionsHijri = { timeZone: "Asia/Riyadh", calendar: 'islamic-uma', day: 'numeric', month: 'long', year: 'numeric' };
            const hijri = new Intl.DateTimeFormat('id-ID-u-ca-islamic-uma', optionsHijri).format(now);
            
            document.getElementById('live-date').innerText = `${hijri} H | ${masehi}`;
        }

        // 2. FETCH JADWAL SHOLAT (REALTIME SAUDI)
        async function fetchPrayTimes() {
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Makkah&country=Saudi+Arabia&method=4');
                const json = await res.json();
                prayTimes = json.data.timings;
                if(document.getElementById('nav-dashboard').classList.contains('active')) navTo('dashboard');
            } catch (e) { console.error("Gagal ambil jadwal sholat"); }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('closed');
        }

        async function apiPost(action, sheet, data = {}) {
            document.getElementById('loading').style.display = 'flex';
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Jika menggunakan Apps Script Web App tanpa CORS handling
                    body: JSON.stringify({ action, sheet, data })
                });
                // Note: Apps Script redirect seringkali membuat response terbaca error di 'no-cors'
                // Idealnya menggunakan library atau handling khusus. 
                // Kita asumsikan sinkronisasi read melalui getDashboard atau read saja:
                if (action === 'read') {
                    const res = await fetch(`${API_URL}?action=read&sheet=${sheet}`);
                    return await res.json();
                }
                return { status: 'success' };
            } catch (err) {
                return { status: 'error', data: [] };
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // 3. FASTER NAVIGATION (CACHE-FIRST)
        async function navTo(page) {
            document.getElementById('page-title').innerText = page;
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${page}`).classList.add('active');
            
            if (window.innerWidth < 1024) document.getElementById('sidebar').classList.add('closed');
            
            // Tampilkan cache dulu agar cepat
            renderPage(page, true);
            
            // Update data di background
            try {
                if (page === 'dashboard') {
                    const res = await (await fetch(`${API_URL}?action=getDashboard`)).json();
                    currentData['dashboard'] = res.data;
                } else {
                    const res = await (await fetch(`${API_URL}?action=read&sheet=${page}`)).json();
                    currentData[page] = res.data || res;
                }
                localStorage.setItem('haji_cache', JSON.stringify(currentData));
                renderPage(page, false);
            } catch (e) { console.warn("Background update failed"); }
        }

        function renderPage(page, isCache) {
            const container = document.getElementById('content');
            const fab = document.getElementById('floating-action');
            const data = currentData[page];

            if (page === 'dashboard') {
                fab.innerHTML = '';
                container.innerHTML = renderDashboard(data || {});
            } else {
                fab.innerHTML = `<div onclick="openEntryForm('${page}')" class="btn-float"><i class="fas fa-plus"></i></div>`;
                
                let html = `<div class="glass-card p-6 animate-slide-up">`;
                
                // Add Filter for Itinerary
                if (page === 'itinerary') {
                    html += `
                    <div class="mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="search-input" onkeyup="filterData('${page}')" placeholder="Cari kegiatan..." class="p-3 rounded-xl border-none ring-1 ring-slate-200 outline-none">
                        <input type="date" id="date-filter" onchange="filterData('${page}')" class="p-3 rounded-xl border-none ring-1 ring-slate-200 outline-none">
                    </div>`;
                } else {
                    html += `
                    <div class="mb-6">
                        <input type="text" id="search-input" onkeyup="filterData('${page}')" placeholder="Cari data ${page}..." class="w-full p-3 rounded-xl border-none ring-1 ring-slate-200 outline-none">
                    </div>`;
                }

                html += `<div id="data-render">${renderList(page, data)}</div></div>`;
                container.innerHTML = html;
            }
        }

        function renderDashboard(stats) {
            const sholat = prayTimes || { Subuh: '--', Dhuhr: '--', Asr: '--', Maghrib: '--', Isha: '--' };
            const nextItin = currentData['itinerary'] ? currentData['itinerary'][0] : null;

            return `
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-slide-up">
                <div class="lg:col-span-2 space-y-6">
                    <div class="glass-card p-8 bg-slate-900 text-white relative overflow-hidden">
                        <i class="fas fa-kaaba absolute right-[-20px] bottom-[-20px] text-9xl opacity-10"></i>
                        <h2 class="font-martel text-2xl font-bold">Ahlan wa Sahlan</h2>
                        <p class="text-emerald-400 text-sm mt-2">Update Handling Haji 2026</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="glass-card p-6">
                            <h3 class="text-xs font-bold uppercase text-slate-400 mb-4 border-b pb-2">🕌 Jadwal Sholat (Makkah)</h3>
                            <div class="grid grid-cols-3 gap-2 text-[10px] font-bold">
                                <div class="p-2 bg-slate-100 rounded text-center">Subuh<br>${sholat.Fajr}</div>
                                <div class="p-2 bg-slate-100 rounded text-center">Dzuhur<br>${sholat.Dhuhr}</div>
                                <div class="p-2 bg-slate-100 rounded text-center">Ashar<br>${sholat.Asr}</div>
                                <div class="p-2 bg-emerald-600 text-white rounded text-center">Maghrib<br>${sholat.Maghrib}</div>
                                <div class="p-2 bg-slate-100 rounded text-center">Isya<br>${sholat.Isha}</div>
                            </div>
                        </div>
                        <div class="glass-card p-6">
                            <h3 class="text-xs font-bold uppercase text-slate-400 mb-4 border-b pb-2">📍 Itinerary Terdekat</h3>
                            ${nextItin ? `
                                <p class="text-emerald-700 font-bold">${nextItin.kegiatan}</p>
                                <p class="text-[10px] text-slate-500">${nextItin.waktu_saudi} @ ${nextItin.lokasi}</p>
                            ` : '<p class="text-xs text-slate-400">Tidak ada jadwal terdekat</p>'}
                        </div>
                    </div>

                    <div class="glass-card p-6">
                        <h3 class="text-xs font-bold uppercase text-slate-400 mb-4 border-b pb-2">🛎️ Pesanan Terbaru</h3>
                        <div class="space-y-2">
                            ${(currentData['pesanan'] || []).slice(0,3).map(p => `
                                <div class="flex justify-between items-center p-3 bg-white rounded-xl shadow-sm border">
                                    <div><p class="text-xs font-bold">${p.nama_pesanan || p.item}</p><p class="text-[9px] text-slate-400">${p.kamar || '-'}</p></div>
                                    <span class="text-[9px] px-2 py-1 bg-amber-100 text-amber-700 rounded-full font-bold">${p.status || 'PROSES'}</span>
                                </div>
                            `).join('') || '<p class="text-center text-xs text-slate-400">Belum ada pesanan aktif</p>'}
                        </div>
                    </div>
                </div>

                <div class="glass-card p-6 border-t-4 border-emerald-600">
                    <h3 class="font-bold text-slate-800 mb-4"><i class="fas fa-sticky-note text-emerald-600 mr-2"></i> Catatan Penting</h3>
                    <div class="space-y-3">
                        ${(currentData['catatan'] || []).slice(0,5).map(c => `
                            <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-100">
                                <p class="text-xs font-bold">${c.judul}</p>
                                <p class="text-[10px] text-slate-500 line-clamp-2">${c.isi}</p>
                            </div>
                        `).join('') || '<p class="text-center text-xs text-slate-400">Belum ada catatan</p>'}
                    </div>
                </div>
            </div>`;
        }

        function renderList(page, data) {
            if (!data || data.length === 0) return `<p class="text-center p-10 text-slate-400">Data tidak ditemukan.</p>`;
            
            // Sort by date and time for itinerary
            if (page === 'itinerary') {
                data.sort((a, b) => new Date(a.tanggal + ' ' + a.waktu_saudi) - new Date(b.tanggal + ' ' + b.waktu_saudi));
            }

            let html = `<div class="overflow-x-auto"><table class="w-full text-left">`;
            const headers = Object.keys(data[0]).filter(h => h !== 'id');
            
            html += `<thead class="bg-slate-50 text-[10px] uppercase text-slate-400 font-bold"><tr>`;
            headers.forEach(h => html += `<th class="px-4 py-3">${h.replace(/_/g,' ')}</th>`);
            html += `</tr></thead><tbody class="divide-y">`;

            data.forEach(item => {
                html += `<tr class="hover:bg-emerald-50 cursor-pointer transition" onclick='showDetail("${page}", ${JSON.stringify(item)})'>`;
                headers.forEach(h => {
                    let val = item[h] || '-';
                    // Format time if contains long code
                    if (h.toLowerCase().includes('waktu') && val.length > 8 && val.includes('T')) {
                        val = new Date(val).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
                    }
                    html += `<td class="px-4 py-4 text-sm font-medium text-slate-700">${val}</td>`;
                });
                html += `</tr>`;
            });

            return html + `</tbody></table></div>`;
        }

        function filterData(page) {
            const query = document.getElementById('search-input').value.toLowerCase();
            const dateVal = document.getElementById('date-filter')?.value;
            
            const filtered = currentData[page].filter(item => {
                const matchSearch = Object.values(item).some(val => String(val).toLowerCase().includes(query));
                const matchDate = dateVal ? (item.tanggal === dateVal) : true;
                return matchSearch && matchDate;
            });
            document.getElementById('data-render').innerHTML = renderList(page, filtered);
        }

        function openEntryForm(page, existingData = null) {
            const modal = document.getElementById('modal');
            const body = document.getElementById('modal-body');
            modal.classList.remove('hidden');
            
            let fields = currentData[page] && currentData[page][0] ? Object.keys(currentData[page][0]) : [];
            if (fields.length === 0) {
                // Fallback fields for new page
                if(page === 'roomlist') fields = ['id','nama_jamaah','nomor_kamar','hotel','bus'];
            }

            let html = `<form id="form-entry" class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
            
            fields.forEach(key => {
                if (key === 'id') {
                    if(existingData) html += `<input type="hidden" name="id" value="${existingData.id}">`;
                    return;
                }
                const val = existingData ? existingData[key] : '';

                html += `<div><label class="text-[10px] font-bold text-slate-400 uppercase">${key.replace(/_/g,' ')}</label>`;
                
                // Plotting Roomlist: Nama Jamaah ambil dari data jamaah
                if (page === 'roomlist' && key === 'nama_jamaah') {
                    html += `<select name="${key}" class="w-full p-3 rounded-xl border mt-1 text-sm outline-none ring-1 ring-slate-200">`;
                    (currentData['jamaah'] || []).forEach(j => {
                        html += `<option value="${j.nama_lengkap}" ${val === j.nama_lengkap ? 'selected' : ''}>${j.nama_lengkap}</option>`;
                    });
                    html += `</select>`;
                } else {
                    const inputType = key.includes('tanggal') ? 'date' : key.includes('waktu') ? 'time' : 'text';
                    html += `<input type="${inputType}" name="${key}" value="${val}" class="w-full p-3 rounded-xl border mt-1 text-sm outline-none ring-1 ring-slate-200 focus:ring-emerald-500">`;
                }
                html += `</div>`;
            });
            
            html += `<div class="md:col-span-2 mt-4">
                <button type="button" onclick="submitData('${page}', ${existingData ? "'update'" : "'insert'"})" class="w-full py-4 bg-emerald-600 text-white rounded-2xl font-bold">SIMPAN DATA</button>
            </div></form>`;
            
            body.innerHTML = html;
        }

        async function submitData(page, action) {
            const form = document.getElementById('form-entry');
            const data = Object.fromEntries(new FormData(form).entries());
            
            const res = await apiPost(action, page, data);
            alert('Permintaan terkirim!');
            closeModal();
            navTo(page);
        }

        function showDetail(type, item) {
            const modal = document.getElementById('modal');
            const body = document.getElementById('modal-body');
            modal.classList.remove('hidden');
            
            let html = `<div class="grid grid-cols-2 gap-4">`;
            for (let key in item) {
                if(key === 'id') continue;
                html += `<div class="bg-slate-50 p-3 rounded-xl">
                    <p class="text-[9px] font-bold text-slate-400 uppercase">${key}</p>
                    <p class="text-sm font-bold text-slate-700">${item[key] || '-'}</p>
                </div>`;
            }
            html += `</div><div class="mt-6 flex gap-2">
                <button onclick='editData("${type}", ${JSON.stringify(item)})' class="flex-1 py-3 bg-emerald-100 text-emerald-700 rounded-xl font-bold text-xs">EDIT</button>
                <button onclick="closeModal()" class="flex-1 py-3 bg-slate-100 text-slate-400 rounded-xl font-bold text-xs">TUTUP</button>
            </div>`;
            body.innerHTML = html;
        }

        function editData(page, item) {
            openEntryForm(page, item);
        }

        function closeModal() { 
            document.getElementById('modal').classList.add('hidden'); 
        }
    </script>
</body>
</html>
