<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Handling Haji 2026 - Jejak Imani</title>
    
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700&family=Martel:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --ji-primary: #0f172a;
            --ji-accent: #059669;
            --ji-gold: #d4af37;
        }

        body { 
            font-family: 'Mulish', sans-serif; 
            background: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }

        /* Background Layer */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: url('https://lh3.googleusercontent.com/d/1S04aXsEdKJ1qAKSNnDNwkzQU5drK2MlP') no-repeat center center fixed;
            background-size: cover;
            opacity: 0.15;
            z-index: -1;
        }

        h1, h2, h3, .font-martel { font-family: 'Martel', serif; }

        /* WELCOME SCREEN */
        #welcome-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-out;
        }
        
        .logo-anim {
            width: 180px;
            animation: pulse-logo 2s infinite ease-in-out;
        }

        @keyframes pulse-logo {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        /* SIDEBAR CUSTOM */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
        }
        
        .sidebar.closed { transform: translateX(-100%); }
        
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            margin: 4px 16px;
            border-radius: 14px;
            color: #64748b;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background: var(--ji-accent);
            color: white;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
        }

        /* GLASS CARD */
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 24px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }

        /* FLOATING BUTTON */
        .btn-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            background: var(--ji-accent);
            color: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 10px 25px rgba(5, 150, 105, 0.3);
            cursor: pointer;
            z-index: 45;
            transition: all 0.3s;
        }
        .btn-float:hover { transform: scale(1.1) rotate(5deg); }

        .loading-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            background: white;
            padding: 8px 20px;
            border-radius: 50px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            z-index: 100;
        }

        @keyframes slide-up {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up { animation: slide-up 0.4s ease-out; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="custom-scrollbar">

    <div class="bg-overlay"></div>

    <!-- 1. WELCOME SCREEN -->
    <div id="welcome-screen">
        <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="logo-anim" alt="Logo">
        <p class="mt-4 font-martel font-bold text-slate-800 tracking-[0.3em] uppercase text-[10px]">Sistem Handling Haji 2026</p>
    </div>

    <!-- 2. LOADING INDICATOR -->
    <div id="loading" class="loading-overlay items-center gap-2 flex">
        <i class="fas fa-circle-notch fa-spin text-emerald-600"></i>
        <span class="text-[11px] font-bold text-slate-600 uppercase tracking-wider">Sinkronisasi Data...</span>
    </div>

    <!-- 3. SIDEBAR -->
    <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 shadow-xl border-r border-white/50">
        <div class="p-8 flex justify-between items-center">
            <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="w-28">
            <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-red-500 transition"><i class="fas fa-times text-xl"></i></button>
        </div>
        <nav class="mt-4 space-y-1">
            <div onclick="navTo('dashboard')" id="nav-dashboard" class="sidebar-item active"><i class="fas fa-home w-5"></i> Dashboard</div>
            <div onclick="navTo('itinerary')" id="nav-itinerary" class="sidebar-item"><i class="fas fa-calendar-day w-5"></i> Itinerary</div>
            <div onclick="navTo('roomlist')" id="nav-roomlist" class="sidebar-item"><i class="fas fa-bed w-5"></i> Roomlist</div>
            <div onclick="navTo('perlengkapan')" id="nav-perlengkapan" class="sidebar-item"><i class="fas fa-luggage-cart w-5"></i> Perlengkapan</div>
            <div onclick="navTo('pesanan')" id="nav-pesanan" class="sidebar-item"><i class="fas fa-concierge-bell w-5"></i> Pesanan</div>
            <div onclick="navTo('jamaah')" id="nav-jamaah" class="sidebar-item"><i class="fas fa-user-friends w-5"></i> Data Jamaah</div>
            <div onclick="navTo('catatan')" id="nav-catatan" class="sidebar-item"><i class="fas fa-pen-nib w-5"></i> Catatan</div>
        </nav>
    </aside>

    <!-- 4. MAIN CONTENT -->
    <main id="main-area" class="lg:ml-[280px] min-h-screen transition-all duration-300">
        <header class="h-20 flex items-center justify-between px-6 lg:px-10 sticky top-0 z-40 bg-white/40 backdrop-blur-lg border-b border-white/20">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="w-10 h-10 bg-white shadow-sm border border-slate-100 text-slate-600 rounded-xl flex items-center justify-center lg:hidden">
                    <i class="fas fa-bars-staggered"></i>
                </button>
                <h1 id="page-title" class="text-sm font-black text-slate-800 uppercase tracking-widest">Dashboard</h1>
            </div>
            <div id="header-time" class="flex items-center gap-4 text-right">
                <div class="hidden md:block">
                    <p id="live-date" class="text-[10px] uppercase font-bold text-slate-400">Loading...</p>
                    <p id="live-clock" class="text-sm font-black text-emerald-600 tabular-nums">00:00:00</p>
                </div>
                <button onclick="refreshData()" class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center hover:rotate-180 transition-all duration-500">
                    <i class="fas fa-sync-alt text-xs"></i>
                </button>
            </div>
        </header>

        <div id="content" class="p-6 lg:p-10 pb-24">
            <!-- Dynamic Content -->
        </div>

        <div id="floating-action"></div>
    </main>

    <!-- 5. MODAL -->
    <div id="modal" class="fixed inset-0 z-[110] hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target === this) closeModal()">
        <div class="bg-white w-full max-w-xl rounded-[32px] shadow-2xl overflow-hidden animate-slide-up border border-white/20">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50/50">
                <h3 id="modal-title" class="font-bold text-slate-800 text-xs uppercase tracking-widest">Detail Informasi</h3>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-300 hover:text-red-500 transition"><i class="fas fa-times"></i></button>
            </div>
            <div id="modal-body" class="p-8 max-h-[75vh] overflow-y-auto custom-scrollbar"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwTeWc1uOnn6DD3pUGDUWQGH-QYv7ShGTNnPgVI18KctFgu2ncclJ6fb6LuUXPuJ2iS/exec';
        let currentData = JSON.parse(localStorage.getItem('haji_cache')) || {};
        let prayTimes = null;
        let currentPage = 'dashboard';

        // Init App
        window.addEventListener('load', () => {
            // Fade out welcome screen
            setTimeout(() => {
                const ws = document.getElementById('welcome-screen');
                if(ws) {
                    ws.style.opacity = '0';
                    setTimeout(() => ws.remove(), 800);
                }
            }, 1200);
            
            fetchPrayTimes();
            updateClock();
            setInterval(updateClock, 1000);
            navTo('dashboard');
        });

        function updateClock() {
            const now = new Date();
            const timeOpt = { timeZone: "Asia/Riyadh", hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const dateOpt = { timeZone: "Asia/Riyadh", weekday: 'long', day: 'numeric', month: 'long' };
            const hijriOpt = { timeZone: "Asia/Riyadh", calendar: 'islamic-uma', day: 'numeric', month: 'long', year: 'numeric' };

            document.getElementById('live-clock').innerText = new Intl.DateTimeFormat('id-ID', timeOpt).format(now);
            const masehi = new Intl.DateTimeFormat('id-ID', dateOpt).format(now);
            const hijri = new Intl.DateTimeFormat('id-ID-u-ca-islamic-uma', hijriOpt).format(now);
            document.getElementById('live-date').innerText = `${hijri} • ${masehi}`;
        }

        async function fetchPrayTimes() {
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Makkah&country=Saudi+Arabia&method=4');
                const json = await res.json();
                prayTimes = json.data.timings;
                if(currentPage === 'dashboard') renderPage('dashboard', false);
            } catch (e) { console.warn("Gagal ambil jadwal sholat"); }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('closed');
        }

        async function navTo(page) {
            currentPage = page;
            document.getElementById('page-title').innerText = page;
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            const navEl = document.getElementById(`nav-${page}`);
            if(navEl) navEl.classList.add('active');
            
            if (window.innerWidth < 1024) toggleSidebar();
            
            renderPage(page, true); // Render from cache first
            refreshData(page);
        }

        async function refreshData(page = currentPage) {
            document.getElementById('loading').style.display = 'flex';
            try {
                let url = page === 'dashboard' ? `${API_URL}?action=getDashboard` : `${API_URL}?action=read&sheet=${page}`;
                const response = await fetch(url);
                const res = await response.json();
                
                currentData[page] = res.data || res;
                localStorage.setItem('haji_cache', JSON.stringify(currentData));
                renderPage(page, false);
            } catch (e) {
                console.error("Fetch error:", e);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderPage(page, isCache) {
            const container = document.getElementById('content');
            const fab = document.getElementById('floating-action');
            const data = currentData[page];

            if (page === 'dashboard') {
                fab.innerHTML = '';
                container.innerHTML = renderDashboard(data || {});
            } else {
                fab.innerHTML = `<div onclick="openEntryForm('${page}')" class="btn-float"><i class="fas fa-plus"></i></div>`;
                
                let html = `
                <div class="glass-card p-6 lg:p-8 animate-slide-up">
                    <div class="flex flex-col md:flex-row gap-4 mb-8">
                        <div class="relative flex-1">
                            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 text-sm"></i>
                            <input type="text" id="search-input" onkeyup="filterData('${page}')" placeholder="Cari data..." 
                                class="w-full pl-12 pr-4 py-3 bg-slate-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-emerald-500 transition outline-none">
                        </div>
                        ${page === 'itinerary' ? `<input type="date" id="date-filter" onchange="filterData('${page}')" class="px-4 py-3 bg-slate-50 rounded-2xl text-sm border-none outline-none focus:ring-2 focus:ring-emerald-500">` : ''}
                    </div>
                    <div id="data-render" class="overflow-hidden">${renderList(page, data)}</div>
                </div>`;
                container.innerHTML = html;
            }
        }

        function renderDashboard(stats) {
            const pt = prayTimes || { Fajr: '--', Dhuhr: '--', Asr: '--', Maghrib: '--', Isha: '--' };
            const itin = currentData['itinerary'] ? currentData['itinerary'][0] : null;

            return `
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-slide-up">
                <div class="lg:col-span-2 space-y-6">
                    <!-- Hero -->
                    <div class="glass-card p-8 bg-slate-900 text-white relative overflow-hidden">
                        <div class="relative z-10">
                            <h2 class="text-xl font-martel font-bold">Ahlan wa Sahlan, Tim Handling</h2>
                            <p class="text-emerald-400 text-[10px] uppercase tracking-[0.2em] font-bold mt-1">Haji 2026 Management System</p>
                        </div>
                        <i class="fas fa-kaaba absolute -right-10 -bottom-10 text-[180px] text-white/5 rotate-12"></i>
                    </div>

                    <!-- Grid Stats -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="glass-card p-6">
                            <h3 class="text-[10px] font-black uppercase text-slate-400 mb-4 flex items-center gap-2">
                                <i class="fas fa-mosque text-emerald-600"></i> Waktu Sholat Makkah
                            </h3>
                            <div class="grid grid-cols-5 gap-2 text-center">
                                ${Object.entries({ Subuh: pt.Fajr, Dzuhur: pt.Dhuhr, Ashar: pt.Asr, Maghrib: pt.Maghrib, Isya: pt.Isha }).map(([n, v]) => `
                                    <div class="p-2 ${n === 'Maghrib' ? 'bg-emerald-600 text-white' : 'bg-slate-50 text-slate-600'} rounded-xl">
                                        <p class="text-[8px] font-bold uppercase mb-1">${n}</p>
                                        <p class="text-[11px] font-black">${v}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="glass-card p-6">
                            <h3 class="text-[10px] font-black uppercase text-slate-400 mb-4 flex items-center gap-2">
                                <i class="fas fa-clock text-emerald-600"></i> Agenda Terdekat
                            </h3>
                            ${itin ? `
                                <p class="text-slate-800 font-bold text-sm line-clamp-1">${itin.kegiatan}</p>
                                <p class="text-[10px] font-medium text-slate-500 mt-1"><i class="fas fa-map-marker-alt mr-1"></i> ${itin.lokasi} • ${itin.waktu_saudi}</p>
                            ` : '<p class="text-xs text-slate-400 italic">Belum ada agenda</p>'}
                        </div>
                    </div>

                    <!-- Orders -->
                    <div class="glass-card p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-[10px] font-black uppercase text-slate-400">🛎️ Pesanan Aktif</h3>
                            <button onclick="navTo('pesanan')" class="text-emerald-600 font-bold text-[10px]">LIHAT SEMUA</button>
                        </div>
                        <div class="space-y-3">
                            ${(currentData['pesanan'] || []).slice(0, 3).map(p => `
                                <div class="flex items-center justify-between p-4 bg-white/50 rounded-2xl border border-white">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-xs"><i class="fas fa-bell"></i></div>
                                        <div>
                                            <p class="text-xs font-bold text-slate-800">${p.nama_pesanan || p.item || 'Pesanan'}</p>
                                            <p class="text-[9px] text-slate-400 font-bold">Kamar: ${p.kamar || '-'}</p>
                                        </div>
                                    </div>
                                    <span class="text-[9px] px-3 py-1 bg-amber-50 text-amber-600 rounded-full font-black uppercase">${p.status || 'PROSES'}</span>
                                </div>
                            `).join('') || '<p class="text-center py-4 text-xs text-slate-300">Tidak ada pesanan aktif</p>'}
                        </div>
                    </div>
                </div>

                <!-- Sidebar Dashboard (Notes) -->
                <div class="glass-card p-6 flex flex-col">
                    <h3 class="text-[10px] font-black uppercase text-slate-400 mb-6 flex items-center gap-2">
                        <i class="fas fa-sticky-note text-amber-500"></i> Catatan Penting
                    </h3>
                    <div class="space-y-4 flex-1">
                        ${(currentData['catatan'] || []).slice(0, 6).map(c => `
                            <div class="p-4 bg-amber-50/50 border-l-4 border-amber-400 rounded-r-2xl">
                                <p class="text-xs font-black text-slate-800 mb-1">${c.judul}</p>
                                <p class="text-[10px] text-slate-600 line-clamp-2 leading-relaxed">${c.isi}</p>
                            </div>
                        `).join('') || '<p class="text-center py-10 text-xs text-slate-300 italic">Belum ada catatan</p>'}
                    </div>
                </div>
            </div>`;
        }

        function renderList(page, data) {
            if (!data || !Array.isArray(data) || data.length === 0) {
                return `<div class="text-center py-20"><i class="fas fa-folder-open text-4xl text-slate-100 mb-4 block"></i><p class="text-slate-400 text-sm">Tidak ada data ditemukan</p></div>`;
            }
            
            const headers = Object.keys(data[0]).filter(h => h.toLowerCase() !== 'id');
            
            let html = `<div class="overflow-x-auto"><table class="w-full">
                <thead><tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">`;
            headers.forEach(h => html += `<th class="px-4 py-4 text-left">${h.replace(/_/g,' ')}</th>`);
            html += `</tr></thead><tbody class="divide-y divide-slate-50">`;

            data.forEach(item => {
                html += `<tr class="hover:bg-slate-50/50 cursor-pointer transition group" onclick='showDetail("${page}", ${JSON.stringify(item)})'>`;
                headers.forEach(h => {
                    let val = item[h] || '-';
                    if (h.toLowerCase().includes('waktu') && val.toString().includes('T')) {
                        val = new Date(val).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
                    }
                    html += `<td class="px-4 py-4 text-xs font-semibold text-slate-600 group-hover:text-emerald-600 transition">${val}</td>`;
                });
                html += `</tr>`;
            });

            return html + `</tbody></table></div>`;
        }

        function filterData(page) {
            const query = document.getElementById('search-input').value.toLowerCase();
            const dateVal = document.getElementById('date-filter')?.value;
            if(!currentData[page]) return;

            const filtered = currentData[page].filter(item => {
                const matchSearch = Object.values(item).some(val => String(val).toLowerCase().includes(query));
                const matchDate = dateVal ? (item.tanggal === dateVal) : true;
                return matchSearch && matchDate;
            });
            document.getElementById('data-render').innerHTML = renderList(page, filtered);
        }

        function showDetail(type, item) {
            const body = document.getElementById('modal-body');
            document.getElementById('modal-title').innerText = `Detail ${type}`;
            
            let html = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">`;
            for (let key in item) {
                if(key.toLowerCase() === 'id') continue;
                html += `
                <div class="p-4 bg-slate-50 rounded-2xl">
                    <p class="text-[9px] font-black text-slate-400 uppercase mb-1">${key.replace(/_/g,' ')}</p>
                    <p class="text-sm font-bold text-slate-800">${item[key] || '-'}</p>
                </div>`;
            }
            html += `</div><div class="mt-8 flex gap-3">
                <button onclick='editData("${type}", ${JSON.stringify(item)})' class="flex-1 py-4 bg-emerald-600 text-white rounded-2xl font-black text-[11px] uppercase tracking-widest shadow-lg shadow-emerald-200">Edit Data</button>
                <button onclick="closeModal()" class="px-8 py-4 bg-slate-100 text-slate-500 rounded-2xl font-black text-[11px] uppercase tracking-widest">Tutup</button>
            </div>`;
            
            body.innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
        }

        function openEntryForm(page, existingData = null) {
            const body = document.getElementById('modal-body');
            document.getElementById('modal-title').innerText = existingData ? `Edit ${page}` : `Tambah ${page}`;
            
            let fields = (currentData[page] && currentData[page][0]) ? Object.keys(currentData[page][0]) : [];
            if (fields.length === 0) {
                fields = page === 'roomlist' ? ['id','nama_jamaah','nomor_kamar','hotel','bus'] : ['id', 'judul', 'isi'];
            }

            let html = `<form id="form-entry" class="grid grid-cols-1 sm:grid-cols-2 gap-5">`;
            fields.forEach(key => {
                if (key.toLowerCase() === 'id') {
                    html += `<input type="hidden" name="id" value="${existingData?.id || ''}">`;
                    return;
                }
                const val = existingData ? existingData[key] : '';
                const isFull = key.toLowerCase() === 'isi' || key.toLowerCase() === 'keterangan';
                
                html += `<div class="${isFull ? 'sm:col-span-2' : ''}">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">${key.replace(/_/g,' ')}</label>`;
                
                if (page === 'roomlist' && key === 'nama_jamaah') {
                    html += `<select name="${key}" class="w-full p-4 bg-slate-50 border-none rounded-2xl mt-1.5 text-sm font-bold focus:ring-2 focus:ring-emerald-500 outline-none">`;
                    (currentData['jamaah'] || []).forEach(j => {
                        html += `<option value="${j.nama_lengkap}" ${val === j.nama_lengkap ? 'selected' : ''}>${j.nama_lengkap}</option>`;
                    });
                    html += `</select>`;
                } else if (isFull) {
                    html += `<textarea name="${key}" rows="4" class="w-full p-4 bg-slate-50 border-none rounded-2xl mt-1.5 text-sm font-bold focus:ring-2 focus:ring-emerald-500 outline-none">${val}</textarea>`;
                } else {
                    const type = key.includes('tanggal') ? 'date' : key.includes('waktu') ? 'time' : 'text';
                    html += `<input type="${type}" name="${key}" value="${val}" class="w-full p-4 bg-slate-50 border-none rounded-2xl mt-1.5 text-sm font-bold focus:ring-2 focus:ring-emerald-500 outline-none">`;
                }
                html += `</div>`;
            });
            
            html += `<div class="sm:col-span-2 mt-6">
                <button type="button" onclick="submitData('${page}', ${existingData ? "'update'" : "'insert'"})" 
                    class="w-full py-5 bg-emerald-600 text-white rounded-[24px] font-black text-xs uppercase tracking-[0.2em] shadow-xl shadow-emerald-100 transition hover:bg-emerald-700">Simpan Perubahan</button>
            </div></form>`;
            
            body.innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
        }

        async function submitData(page, action) {
            const form = document.getElementById('form-entry');
            const data = Object.fromEntries(new FormData(form).entries());
            
            document.getElementById('loading').style.display = 'flex';
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action, sheet: page, data })
                });
                closeModal();
                refreshData(page);
            } catch (err) {
                alert('Gagal mengirim data. Silakan coba lagi.');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function editData(page, item) { openEntryForm(page, item); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
    </script>
</body>
</html>
