<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handling Haji 2026 - Jejak Imani</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Martel:wght@700&family=Mulish:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Mulish', sans-serif; }
        h1, h2, h3 { font-family: 'Martel', serif; }
        .bg-custom { 
            background-image: url('https://drive.google.com/uc?export=view&id=1S04aXsEdKJ1qAKSNnDNwkzQU5drK2MlP');
            background-size: cover;
            background-attachment: fixed;
        }
        #welcome-screen {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.8s ease;
        }
    </style>
</head>
<body class="bg-custom text-slate-800">

    <div id="welcome-screen" class="bg-custom">
        <div class="bg-white/80 p-10 rounded-full animate-pulse text-center">
            <img src="https://drive.google.com/uc?export=view&id=1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" alt="Logo" class="w-40">
        </div>
    </div>

    <div id="main-app" class="hidden flex min-h-screen">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out">
            <div class="p-6">
                <img src="https://drive.google.com/uc?export=view&id=1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="w-20 mb-6">
                <nav class="space-y-1">
                    <button onclick="showPage('dashboard')" class="w-full text-left p-3 hover:bg-green-50 rounded-lg transition">Dashboard</button>
                    <button onclick="showPage('itinerary')" class="w-full text-left p-3 hover:bg-green-50 rounded-lg transition">Itinerary</button>
                    <button onclick="showPage('roomlist')" class="w-full text-left p-3 hover:bg-green-50 rounded-lg transition">Roomlist</button>
                    <button onclick="showPage('perlengkapan')" class="w-full text-left p-3 hover:bg-green-50 rounded-lg transition">Perlengkapan</button>
                    <button onclick="showPage('pesanan')" class="w-full text-left p-3 hover:bg-green-50 rounded-lg transition">Pesanan</button>
                    <button onclick="showPage('jamaah')" class="w-full text-left p-3 hover:bg-green-50 rounded-lg transition">Data Jamaah</button>
                    <button onclick="showPage('catatan')" class="w-full text-left p-3 hover:bg-green-50 rounded-lg transition">Catatan</button>
                </nav>
            </div>
            <button onclick="toggleSidebar()" class="absolute top-4 right-[-40px] bg-white p-2 rounded-r shadow-md font-bold text-green-800">✕</button>
        </aside>

        <main class="flex-1 p-4 md:p-8">
            <header class="flex justify-between items-center mb-6 bg-white/90 p-4 rounded-xl shadow-sm">
                <button onclick="toggleSidebar()" class="text-2xl">☰</button>
                <h2 id="page-title" class="text-xl font-bold text-green-900 uppercase">Dashboard</h2>
                <div class="w-10"></div>
            </header>

            <div id="content-render" class="bg-white/90 p-6 rounded-2xl shadow-lg min-h-[70vh]"></div>
        </main>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw3t4ld9deKYGr7OANyiinlCDR9WJqjaQ5NIrxUy7D2faUS8IGBdXlkRhW5E-LtQ_8e/exec';
        
        let appData = { rawRoomlist: [] };

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('welcome-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('welcome-screen').style.display = 'none';
                    document.getElementById('main-app').classList.remove('hidden');
                    loadDashboard();
                }, 800);
            }, 2000);
        };

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function renderLoading() {
            document.getElementById('content-render').innerHTML = `<div class="flex flex-col items-center justify-center py-20"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-green-700"></div><p class="mt-4 text-gray-500">Sinkronisasi Data...</p></div>`;
        }

        async function loadDashboard() {
            renderLoading();
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getDashboard`);
                const data = await res.json();
                renderDashboard(data);
            } catch (err) {
                document.getElementById('content-render').innerHTML = `<p class="text-red-500 text-center">Gagal koneksi ke server.</p>`;
            }
        }

        function renderDashboard(data) {
            const now = new Date();
            const saudiTime = new Date(now.getTime() - (4 * 60 * 60 * 1000));
            document.getElementById('content-render').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-gradient-to-br from-green-800 to-green-950 text-white p-6 rounded-2xl shadow-lg">
                        <h3 class="text-xs opacity-70 uppercase">Waktu Indonesia</h3>
                        <p class="text-xl font-bold">${now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long'})}</p>
                        <hr class="my-3 opacity-20">
                        <h3 class="text-xs opacity-70 uppercase">Waktu Saudi Arabia</h3>
                        <p class="text-xl font-bold">${saudiTime.toLocaleTimeString('id-ID')} AST</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border shadow-sm">
                        <h3 class="text-green-800 font-bold mb-4 flex items-center">🕌 Jadwal Sholat (Makkah)</h3>
                        <div class="grid grid-cols-5 gap-2 text-center text-[10px] font-bold uppercase">
                            <div class="p-2 bg-gray-50 rounded">Subuh<br>04:50</div>
                            <div class="p-2 bg-gray-50 rounded">Dzuhur<br>12:22</div>
                            <div class="p-2 bg-green-50 text-green-700 border border-green-200 rounded">Ashar<br>15:45</div>
                            <div class="p-2 bg-gray-50 rounded">Maghrib<br>18:50</div>
                            <div class="p-2 bg-gray-50 rounded">Isya<br>20:20</div>
                        </div>
                    </div>
                    <div class="col-span-1 md:col-span-2 bg-white p-6 rounded-2xl border shadow-sm">
                        <h3 class="text-green-800 font-bold mb-4 italic">📅 Agenda Terdekat</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm text-left">
                                <tr class="text-gray-400 border-b text-xs uppercase">
                                    <th class="pb-2">Saudi</th><th class="pb-2">WIB</th><th class="pb-2">Kegiatan</th>
                                </tr>
                                ${data.itinerary.slice(0,3).map(i => `<tr class="border-b last:border-0"><td class="py-3 font-bold">${i.waktu_saudi}</td><td class="py-3 text-gray-400">${i.waktu_wib}</td><td class="py-3">${i.kegiatan}</td></tr>`).join('')}
                            </table>
                        </div>
                    </div>
                </div>`;
        }

        async function showPage(page) {
            document.getElementById('page-title').innerText = page;
            toggleSidebar();
            renderLoading();
            try {
                const action = 'get' + page.charAt(0).toUpperCase() + page.slice(1);
                const res = await fetch(`${SCRIPT_URL}?action=${action}`);
                const data = await res.json();
                if(page === 'itinerary') renderItinerary(data);
                else if(page === 'roomlist') { appData.rawRoomlist = data; renderRoomlist('Makkah'); }
                else if(page === 'jamaah') renderJamaah(data);
                else if(page === 'pesanan') renderPesanan(data);
                else if(page === 'dashboard') loadDashboard();
            } catch (e) { console.error(e); }
        }

        function renderItinerary(data) {
            document.getElementById('content-render').innerHTML = `
                <div class="flex justify-between items-center mb-4"><h3 class="font-bold">Tabel Itinerary</h3><button class="bg-green-700 text-white px-4 py-2 rounded-lg text-xs">+ Tambah</button></div>
                <div class="overflow-x-auto"><table class="w-full text-sm">
                    <tr class="bg-gray-100 text-left"><th class="p-3">KSA</th><th class="p-3">WIB</th><th class="p-3">Kegiatan</th><th class="p-3">Aksi</th></tr>
                    ${data.map(i => `<tr class="border-b"><td class="p-3 font-bold">${i.waktu_saudi}</td><td class="p-3 text-gray-400">${i.waktu_wib}</td><td class="p-3">${i.kegiatan}</td><td class="p-3"><button class="text-blue-600">Edit</button></td></tr>`).join('')}
                </table></div>`;
        }

        function renderRoomlist(filter) {
            const rooms = appData.rawRoomlist.filter(r => r.kategori_hotel === filter);
            document.getElementById('content-render').innerHTML = `
                <div class="flex gap-2 mb-6 overflow-x-auto">
                    ${['Makkah','Madinah','Transit'].map(f => `<button onclick="renderRoomlist('${f}')" class="px-4 py-2 rounded-full text-xs font-bold ${filter===f?'bg-green-800 text-white':'bg-gray-200'}">${f}</button>`).join('')}
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${rooms.map(r => `<div class="bg-white border p-4 rounded-xl shadow-sm">
                        <div class="flex justify-between"><div><p class="text-[10px] text-gray-400">Kamar ${r.no_kamar}</p><h4 class="font-bold text-lg">Room #${r.no_roomlist}</h4></div><span class="text-[10px] bg-blue-50 text-blue-600 p-1 rounded">${r.tipe_kamar}</span></div>
                        <p class="mt-2 text-xs text-gray-600 font-mono">ID Jamaah: ${r.id_jamaah}</p>
                    </div>`).join('')}
                </div>`;
        }

        function renderJamaah(data) {
            document.getElementById('content-render').innerHTML = `
                <input type="text" id="qJam" onkeyup="filterJam()" placeholder="Cari Jamaah..." class="w-full p-4 mb-4 border rounded-xl outline-none focus:ring-2 focus:ring-green-700">
                <div class="overflow-x-auto"><table class="w-full text-sm text-left">
                    <tr class="bg-gray-100"><th class="p-3">Nama</th><th class="p-3">Paspor</th><th class="p-3">Paket</th></tr>
                    <tbody id="tJam">${data.map(j => `<tr class="border-b"><td class="p-3 font-bold text-green-900">${j.nama_lengkap}</td><td class="p-3">${j.no_paspor}</td><td class="p-3 text-xs uppercase">${j.paket_haji}</td></tr>`).join('')}</tbody>
                </table></div>`;
        }

        function filterJam() {
            let q = document.getElementById('qJam').value.toLowerCase();
            document.querySelectorAll('#tJam tr').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(q) ? "" : "none";
            });
        }

        function renderPesanan(data) {
            document.getElementById('content-render').innerHTML = `
                <div class="grid gap-4">
                    ${data.map(p => `
                        <div class="bg-white p-4 rounded-xl border-l-4 shadow-sm flex justify-between items-center ${p.status_pesanan === 'Pending' ? 'border-red-500' : 'border-yellow-500'}">
                            <div><p class="text-[10px] text-gray-400">${p.waktu_order}</p><h4 class="font-bold">Kamar ${p.no_kamar} - ${p.nama_barang}</h4><p class="text-xs">Qty: ${p.qty}</p></div>
                            <select onchange="updateStatus('${p.id}', this.value)" class="text-xs border p-2 rounded bg-gray-50">
                                <option value="Pending" ${p.status_pesanan==='Pending'?'selected':''}>Pending</option>
                                <option value="Proses" ${p.status_pesanan==='Proses'?'selected':''}>Proses</option>
                                <option value="Selesai">Selesai (Hapus)</option>
                            </select>
                        </div>`).join('')}
                </div>`;
        }

        async function updateStatus(id, status) {
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'updateStatusPesanan', id: id, status: status })
                });
                alert('Status Diperbarui');
                showPage('pesanan');
            } catch(e) { alert('Gagal Update'); }
        }
    </script>
</body>
</html>
