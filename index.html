<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handling Haji Pro - Jejak Imani</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .sidebar-item { transition: all 0.2s ease; color: #64748b; font-weight: 500; cursor: pointer; }
        .sidebar-item.active { background-color: #ecfdf5; color: #059669; font-weight: 700; border-right: 4px solid #059669; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; }
        
        #sidebar.collapsed { transform: translateX(-100%); position: absolute; }
        #main-content.expanded { margin-left: 0 !important; }

        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        tr.clickable { cursor: pointer; transition: background 0.2s; }
        tr.clickable:hover { background-color: #f1f5f9; }

        .modal-detail { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        
        /* Suggestion Search highlight */
        .search-highlight { background-color: #fef08a; padding: 2px; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex" onload="navTo('dashboard')">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white shadow-2xl transition-all duration-300 border-r border-slate-100">
        <div class="flex flex-col h-full">
            <div class="p-8 flex justify-between items-center border-b border-slate-50">
                <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="w-28">
                <button onclick="toggleSidebar()" class="text-slate-400 p-2 lg:hidden"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                <div onclick="navTo('dashboard')" id="btn-dashboard" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-house-chimney w-5"></i> Dashboard
                </div>
                <div onclick="navTo('itinerary')" id="btn-itinerary" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-route w-5"></i> Itinerary
                </div>
                <div onclick="navTo('roomlist')" id="btn-roomlist" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-hotel w-5"></i> Roomlist
                </div>
                <div onclick="navTo('pesanan')" id="btn-pesanan" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-bell-concierge w-5"></i> Pesanan
                </div>
                <div onclick="navTo('jamaah')" id="btn-jamaah" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-user-group w-5"></i> Data Jamaah
                </div>
                <div onclick="navTo('perlengkapan')" id="btn-perlengkapan" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-boxes-packing w-5"></i> Perlengkapan
                </div>
                <div onclick="navTo('catatan')" id="btn-catatan" class="sidebar-item px-4 py-3 rounded-xl flex items-center gap-4">
                    <i class="fa-solid fa-note-sticky w-5"></i> Catatan
                </div>
            </nav>
        </div>
    </aside>

    <!-- CONTENT AREA -->
    <div id="main-content" class="flex-1 lg:ml-72 flex flex-col min-h-screen transition-all duration-300">
        <header class="h-20 bg-white/80 backdrop-blur-md border-b sticky top-0 z-40 flex items-center justify-between px-6">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center hover:bg-emerald-100">
                    <i class="fa-solid fa-bars-staggered"></i>
                </button>
                <h2 id="page-title" class="font-bold text-slate-800 uppercase tracking-widest text-xs">Dashboard</h2>
            </div>
            <div class="flex items-center gap-4">
                <div id="sync-icon" class="hidden"><i class="fa-solid fa-rotate fa-spin text-emerald-600"></i></div>
                <div class="text-right hidden sm:block">
                    <p id="live-clock" class="text-sm font-bold text-slate-800">00:00:00</p>
                    <p id="hijri-date" class="text-[10px] text-emerald-600 font-bold uppercase tracking-tighter italic">Loading Hijri...</p>
                </div>
            </div>
        </header>

        <main id="content-render" class="p-4 md:p-8">
            <!-- Content Injected Here -->
        </main>
    </div>

    <!-- MODAL DETAIL POPUP -->
    <div id="modal-detail" class="fixed inset-0 z-[110] hidden modal-detail flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-[2rem] shadow-2xl overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800">Detail Informasi</h3>
                <button onclick="closeDetail()" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-circle-xmark text-2xl"></i></button>
            </div>
            <div id="detail-content" class="p-8 space-y-4 max-h-[70vh] overflow-y-auto text-slate-700">
                <!-- Detail items injected here -->
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzGhnIqwfiZQTvS4PI63QcQyZ18uLEOZEfp5BECWMkMHsJicuVvg-MOKbCIqrTTG8-w/exec';
        let fullData = [];
        let dashboardData = { catatan: [] };

        function updateTime() {
            const now = new Date();
            const saudiTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Riyadh"}));
            document.getElementById('live-clock').innerText = saudiTime.toLocaleTimeString('id-ID', { hour12: false });
            const options = { day: 'numeric', month: 'long', year: 'numeric', calendar: 'islamic-uma' };
            document.getElementById('hijri-date').innerText = new Intl.DateTimeFormat('id-ID-u-ca-islamic-uma', options).format(now);
        }
        setInterval(updateTime, 1000);

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const main = document.getElementById('main-content');
            sidebar.classList.toggle('-translate-x-full');
            if(window.innerWidth >= 1024) {
                main.classList.toggle('lg:ml-72');
            }
        }

        async function navTo(page) {
            document.getElementById('page-title').innerText = page;
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`btn-${page}`).classList.add('active');
            if (window.innerWidth < 1024) document.getElementById('sidebar').classList.add('-translate-x-full');
            
            await loadData(page);
        }

        async function loadData(page) {
            const container = document.getElementById('content-render');
            document.getElementById('sync-icon').classList.remove('hidden');
            
            try {
                const res = await fetch(`${SCRIPT_URL}?action=get${page.charAt(0).toUpperCase() + page.slice(1)}`);
                fullData = await res.json();
                
                // Simpan data catatan jika sedang di dashboard untuk sinkronisasi
                if(page === 'catatan') dashboardData.catatan = fullData;
                
                renderContent(page, fullData);
            } catch (e) {
                container.innerHTML = `<p class="text-center p-10 text-slate-400">Gagal memuat data atau koneksi terputus.</p>`;
            } finally {
                document.getElementById('sync-icon').classList.add('hidden');
            }
        }

        function renderContent(page, data) {
            const container = document.getElementById('content-render');
            let html = '';

            // Search Bar (Kini berfungsi secara universal di tiap menu)
            if(['jamaah', 'roomlist', 'perlengkapan', 'itinerary', 'catatan'].includes(page)) {
                html += `
                <div class="flex flex-col md:flex-row gap-4 mb-6">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-300"></i>
                        <input type="text" id="main-search" onkeyup="searchData(this.value, '${page}')" placeholder="Cari di menu ${page}..." class="w-full pl-12 pr-4 py-3 rounded-2xl border-none ring-1 ring-slate-200 focus:ring-emerald-500 outline-none shadow-sm">
                    </div>
                </div>`;
            }

            if(page === 'dashboard') {
                html = renderDashboard(data);
            } else if(page === 'jamaah') {
                html += `
                <div class="glass-card rounded-[2rem] table-container">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] font-bold text-slate-400 uppercase tracking-widest border-b">
                            <tr><th class="px-6 py-4">Kode</th><th class="px-6 py-4">Nama Lengkap</th><th class="px-6 py-4">Bus/Paket</th><th class="px-6 py-4">Paspor</th></tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-50">
                            ${data.map(j => `
                            <tr class="clickable" onclick='showDetail("jamaah", ${JSON.stringify(j)})'>
                                <td class="px-6 py-4 font-mono text-xs text-emerald-600">${j.kode_ji || '-'}</td>
                                <td class="px-6 py-4 font-bold text-slate-800">${j.nama_lengkap}</td>
                                <td class="px-6 py-4 text-slate-500 text-xs">Bus ${j.bus || '-'} / ${j.paket || '-'}</td>
                                <td class="px-6 py-4 font-mono text-slate-400 text-xs">${j.no_paspor || '-'}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>`;
            } else if(page === 'catatan') {
                html += `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${data.map(c => `
                    <div class="glass-card p-6 rounded-3xl border-l-4 border-yellow-400">
                        <h4 class="font-bold text-slate-800 mb-2">${c.judul || 'Tanpa Judul'}</h4>
                        <p class="text-sm text-slate-600">${c.isi || ''}</p>
                    </div>`).join('')}
                </div>`;
            } else if(page === 'itinerary') {
                html += `<div class="glass-card rounded-[2rem] table-container">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] font-bold text-slate-400 uppercase tracking-widest border-b">
                            <tr><th class="px-6 py-4">Waktu Saudi</th><th class="px-6 py-4">Kegiatan</th></tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50">
                            ${data.map(i => `
                            <tr class="clickable" onclick='showDetail("itinerary", ${JSON.stringify(i)})'>
                                <td class="px-6 py-4 font-bold text-emerald-700">${i.waktu_saudi}</td>
                                <td class="px-6 py-4 text-slate-600">${i.kegiatan}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>`;
            } else {
                html += `<div class="p-10 text-center text-slate-300">Modul ${page} siap ditampilkan.</div>`;
            }

            container.innerHTML = html;
        }

        function renderDashboard(data) {
            // Mengambil 2 catatan terakhir untuk ditampilkan di dashboard
            const recentNotes = dashboardData.catatan.slice(0, 2);
            
            return `
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-emerald-900 p-8 rounded-[2.5rem] text-white shadow-2xl relative overflow-hidden">
                        <i class="fa-solid fa-kaaba absolute right-[-5%] bottom-[-5%] text-[10rem] opacity-10"></i>
                        <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-widest mb-1">Status Terkini</h3>
                        <p class="text-xl font-bold mb-4">Handling Jamaah Haji Jejak Imani</p>
                        <div class="flex gap-2">
                            <span class="bg-white/10 px-3 py-1 rounded-full text-[10px] font-bold uppercase">Ready to Serve</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="glass-card p-6 rounded-3xl">
                            <h4 class="text-xs font-bold text-slate-400 uppercase mb-4 border-b pb-2 flex justify-between">
                                <span>🛎️ Pesanan Standby</span>
                            </h4>
                            <div class="space-y-3">
                                <p class="text-sm text-slate-400 italic">Gunakan menu pesanan untuk update...</p>
                            </div>
                        </div>
                        <div class="glass-card p-6 rounded-3xl">
                            <h4 class="text-xs font-bold text-slate-400 uppercase mb-4 border-b pb-2">🕌 Jadwal Sholat</h4>
                            <div class="grid grid-cols-2 gap-2 text-[11px] font-bold">
                                <div class="bg-emerald-50 p-2 rounded text-emerald-700">Subuh: 04:52</div>
                                <div class="bg-slate-50 p-2 rounded text-slate-500">Dzuhur: 12:21</div>
                                <div class="bg-slate-50 p-2 rounded text-slate-500">Ashar: 15:45</div>
                                <div class="bg-emerald-500 p-2 rounded text-white">Maghrib: 18:52</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- KOLOM CATATAN DASHBOARD -->
                <div onclick="navTo('catatan')" class="glass-card p-8 rounded-[2.5rem] border-t-8 border-emerald-600 cursor-pointer hover:shadow-lg transition-all">
                    <h3 class="font-bold text-slate-800 mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-pen-nib text-emerald-600"></i> Catatan Terbaru
                    </h3>
                    <div class="space-y-4">
                        ${recentNotes.length > 0 ? recentNotes.map(n => `
                            <div class="p-4 bg-slate-50 rounded-2xl border-l-4 border-emerald-400">
                                <h5 class="text-xs font-bold text-slate-800 mb-1">${n.judul}</h5>
                                <p class="text-[11px] text-slate-600 truncate">${n.isi}</p>
                            </div>
                        `).join('') : `
                            <div class="p-4 bg-yellow-50 rounded-2xl border-l-4 border-yellow-400">
                                <p class="text-[11px] text-yellow-700 font-bold">Klik untuk sinkronisasi catatan...</p>
                            </div>
                        `}
                    </div>
                    <p class="mt-6 text-[10px] font-bold text-emerald-600 text-center uppercase tracking-widest">Klik untuk lihat semua</p>
                </div>
            </div>`;
        }

        function showDetail(type, item) {
            const modal = document.getElementById('modal-detail');
            const content = document.getElementById('detail-content');
            modal.classList.remove('hidden');
            
            let html = '';
            if(type === 'jamaah') {
                html = `
                <div class="space-y-6">
                    <div class="text-center">
                         <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-2">
                            <i class="fa-solid fa-user-tie text-2xl"></i>
                         </div>
                         <h4 class="font-bold text-xl">${item.nama_lengkap}</h4>
                         <span class="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest">Bus ${item.bus} - ${item.paket}</span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-y-4 gap-x-6 text-sm border-t pt-6">
                        <div><p class="text-[10px] text-slate-400 font-bold uppercase">Kode JI</p><p class="font-bold">${item.kode_ji || '-'}</p></div>
                        <div><p class="text-[10px] text-slate-400 font-bold uppercase">No Paspor</p><p class="font-mono font-bold text-emerald-600">${item.no_paspor || '-'}</p></div>
                        <div><p class="text-[10px] text-slate-400 font-bold uppercase">Jenis Kelamin</p><p class="font-bold">${item.jenis_kelamin || '-'}</p></div>
                        <div><p class="text-[10px] text-slate-400 font-bold uppercase">Pekerjaan</p><p class="font-bold">${item.pekerjaan || '-'}</p></div>
                        <div><p class="text-[10px] text-slate-400 font-bold uppercase">TTL</p><p class="font-bold text-xs">${item.tempat_lahir || '-'}, ${item.tanggal_lahir || '-'}</p></div>
                        <div><p class="text-[10px] text-slate-400 font-bold uppercase">Usia</p><p class="font-bold">${item.usia || '-'} Tahun</p></div>
                        <div><p class="text-[10px] text-slate-400 font-bold uppercase">Status Nikah</p><p class="font-bold">${item.status_nikah || '-'}</p></div>
                        <div><p class="text-[10px] text-slate-400 font-bold uppercase">No. HP</p><p class="font-bold">${item.no_hp || '-'}</p></div>
                    </div>

                    <div class="bg-red-50 p-4 rounded-2xl">
                        <p class="text-[10px] text-red-400 font-bold uppercase mb-1">Riwayat Penyakit</p>
                        <p class="text-sm font-bold text-red-700">${item.riwayat_penyakit || 'Tidak ada riwayat'}</p>
                    </div>
                </div>`;
            } else if(type === 'itinerary') {
                html = `<div class="space-y-4">
                    <div class="p-4 bg-emerald-50 rounded-2xl"><p class="text-[10px] font-bold text-emerald-600 uppercase">Kegiatan Utama</p><p class="font-bold text-lg text-slate-800">${item.kegiatan}</p></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><p class="text-[10px] font-bold text-slate-400 uppercase">Waktu Saudi</p><p class="font-bold text-slate-700">${item.waktu_saudi}</p></div>
                        <div><p class="text-[10px] font-bold text-slate-400 uppercase">Waktu Indonesia</p><p class="font-bold text-slate-700">${item.waktu_wib || '-'}</p></div>
                    </div>
                </div>`;
            }
            content.innerHTML = html;
        }

        function closeDetail() { document.getElementById('modal-detail').classList.add('hidden'); }

        // FUNGSI SEARCH PER MENU
        function searchData(query, page) {
            const q = query.toLowerCase();
            const tableBody = document.getElementById('table-body');
            
            // Filter data asli
            const filtered = fullData.filter(item => {
                return Object.values(item).some(val => 
                    String(val).toLowerCase().includes(q)
                );
            });

            // Re-render hanya bagian list/tabelnya saja agar tidak kedip
            if (page === 'jamaah') {
                const rows = filtered.map(j => `
                    <tr class="clickable" onclick='showDetail("jamaah", ${JSON.stringify(j)})'>
                        <td class="px-6 py-4 font-mono text-xs text-emerald-600">${j.kode_ji || '-'}</td>
                        <td class="px-6 py-4 font-bold text-slate-800">${j.nama_lengkap}</td>
                        <td class="px-6 py-4 text-slate-500 text-xs">Bus ${j.bus || '-'} / ${j.paket || '-'}</td>
                        <td class="px-6 py-4 font-mono text-slate-400 text-xs">${j.no_paspor || '-'}</td>
                    </tr>`).join('');
                tableBody.innerHTML = rows || '<tr><td colspan="4" class="p-10 text-center text-slate-400">Data tidak ditemukan</td></tr>';
            } else if (page === 'catatan') {
                // Untuk grid view catatan
                renderContent('catatan', filtered);
                // Kembalikan value input agar tidak hilang saat re-render
                document.getElementById('main-search').value = query;
                document.getElementById('main-search').focus();
            }
        }
    </script>
</body>
</html>
