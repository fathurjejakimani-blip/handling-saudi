<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Handling Haji 2026 - Jejak Imani</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700&family=Martel:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --ji-primary: #0f172a; --ji-accent: #059669; --ji-gold: #d4af37; }
        body { font-family: 'Mulish', sans-serif; background: #f8fafc; margin: 0; }
        h1, h2, h3, .font-martel { font-family: 'Martel', serif; }

        /* Floating Button Fixed */
        .btn-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--ji-accent);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.4);
            z-index: 100;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-float:hover { transform: scale(1.1); }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .sidebar { width: 280px; transition: transform 0.3s ease; z-index: 50; }
        .sidebar.closed { transform: translateX(-100%); }

        /* Loading Spinner */
        #loading { display: none; }
        .shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-slate-50">

    <!-- HEADER LOGO (FIXED TOP) -->
    <header class="lg:ml-[280px] h-20 bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b px-6 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <button onclick="toggleSidebar()" class="p-2 text-slate-600 lg:hidden"><i class="fas fa-bars text-xl"></i></button>
            <h1 id="page-title" class="font-bold text-slate-800 uppercase tracking-tight text-sm lg:text-lg">Dashboard</h1>
        </div>
        <div class="text-right">
            <p id="live-clock" class="font-bold text-emerald-600 text-lg leading-none">00:00:00</p>
            <p id="live-date-hijri" class="text-[10px] font-bold text-amber-600 uppercase mt-1"></p>
            <p id="live-date-masehi" class="text-[9px] text-slate-400 font-semibold"></p>
        </div>
    </header>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 bg-slate-900 text-white shadow-2xl overflow-y-auto">
        <div class="p-8 border-b border-slate-800 flex justify-between items-center">
            <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="w-32 brightness-200">
        </div>
        <nav class="p-4 space-y-2">
            <div onclick="navTo('dashboard')" class="nav-item p-4 rounded-xl flex items-center gap-4 cursor-pointer hover:bg-emerald-600/20 transition"><i class="fas fa-home w-5"></i> Dashboard</div>
            <div onclick="navTo('itinerary')" class="nav-item p-4 rounded-xl flex items-center gap-4 cursor-pointer hover:bg-emerald-600/20 transition"><i class="fas fa-calendar-alt w-5"></i> Itinerary</div>
            <div onclick="navTo('roomlist')" class="nav-item p-4 rounded-xl flex items-center gap-4 cursor-pointer hover:bg-emerald-600/20 transition"><i class="fas fa-bed w-5"></i> Roomlist</div>
            <div onclick="navTo('perlengkapan')" class="nav-item p-4 rounded-xl flex items-center gap-4 cursor-pointer hover:bg-emerald-600/20 transition"><i class="fas fa-box w-5"></i> Perlengkapan</div>
            <div onclick="navTo('pesanan')" class="nav-item p-4 rounded-xl flex items-center gap-4 cursor-pointer hover:bg-emerald-600/20 transition"><i class="fas fa-shopping-cart w-5"></i> Pesanan</div>
            <div onclick="navTo('jamaah')" class="nav-item p-4 rounded-xl flex items-center gap-4 cursor-pointer hover:bg-emerald-600/20 transition"><i class="fas fa-users w-5"></i> Data Jamaah</div>
            <div onclick="navTo('catatan')" class="nav-item p-4 rounded-xl flex items-center gap-4 cursor-pointer hover:bg-emerald-600/20 transition"><i class="fas fa-notes-medical w-5"></i> Catatan Medis</div>
        </nav>
    </aside>

    <!-- MAIN AREA -->
    <main class="lg:ml-[280px] p-4 lg:p-8">
        <div id="loading-bar" class="hidden w-full h-1 bg-emerald-500 fixed top-0 left-0 animate-pulse z-[60]"></div>
        <div id="content-area" class="max-w-6xl mx-auto">
            <!-- Content will be injected here -->
        </div>
    </main>

    <!-- FLOATING ACTION BUTTON -->
    <div id="fab" class="btn-float hidden" onclick="handlePlusButton()">
        <i class="fas fa-plus text-2xl"></i>
    </div>

    <!-- MODAL -->
    <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-slate-800">Form Input</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-red-500"><i class="fas fa-times-circle text-2xl"></i></button>
            </div>
            <div id="modal-body" class="p-6 max-h-[70vh] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyo8IsAYBM8yZRB-GHfAfH0Hmss3XWNu2bW7ou4Lo7ktH8-RkM05VDfmsSEDlFzPWy5/exec'; // GANTI DENGAN URL DEPLOY ANDA
        let cacheData = {}; 
        let currentPage = 'dashboard';

        // 1. JAM & TANGGAL (HIJRI FIX)
        function updateClock() {
            const now = new Date();
            const saudiTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Riyadh"}));
            
            document.getElementById('live-clock').innerText = saudiTime.toLocaleTimeString('id-ID', { hour12: false });
            
            // Masehi
            const optMasehi = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('live-date-masehi').innerText = saudiTime.toLocaleDateString('id-ID', optMasehi);
            
            // Hijriah (Intl format fix)
            const optHijri = new Intl.DateTimeFormat('id-ID-u-ca-islamic-uma-nu-latn', {
                day: 'numeric', month: 'long', year: 'numeric'
            }).format(saudiTime);
            document.getElementById('live-date-hijri').innerText = optHijri + ' H';
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. NAVIGASI & SPEED OPTIMIZATION
        async function navTo(page) {
            currentPage = page;
            document.getElementById('page-title').innerText = page;
            document.getElementById('loading-bar').classList.remove('hidden');
            
            // FAB Visibility
            const fab = document.getElementById('fab');
            page === 'dashboard' ? fab.classList.add('hidden') : fab.classList.remove('hidden');

            try {
                // Fetch data (Gunakan cache jika memungkinkan untuk responsivitas)
                const res = await fetch(`${API_URL}?action=readAll`);
                const allData = await res.json();
                cacheData = allData;

                renderContent(page, allData);
            } catch (e) {
                console.error("Gagal memuat data", e);
            } finally {
                document.getElementById('loading-bar').classList.add('hidden');
            }
        }

        function renderContent(page, data) {
            const container = document.getElementById('content-area');
            
            if (page === 'dashboard') {
                container.innerHTML = renderDashboard(data);
            } else if (page === 'itinerary') {
                container.innerHTML = renderItinerary(data.itinerary);
            } else if (page === 'roomlist') {
                container.innerHTML = renderRoomlist(data.roomlist);
            } else {
                container.innerHTML = renderGenericTable(page, data[page]);
            }
        }

        // 3. DASHBOARD INTEGRATION
        function renderDashboard(data) {
            // Filter Itinerary Terdekat (Hari ini atau Besok)
            const now = new Date();
            const itineraryTerdekat = data.itinerary
                .filter(i => new Date(i.tanggal) >= now.setHours(0,0,0,0))
                .sort((a,b) => new Date(a.tanggal) - new Date(b.tanggal))
                .slice(0, 2);

            return `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- STATS & JADWAL SHOLAT -->
                <div class="md:col-span-2 space-y-6">
                    <div class="glass-card p-6 bg-slate-900 text-white">
                        <p class="text-xs text-emerald-400 font-bold uppercase tracking-widest mb-1">Itinerary Terdekat</p>
                        ${itineraryTerdekat.map(i => `
                            <div class="flex justify-between items-center border-b border-slate-700 py-3 last:border-0">
                                <div>
                                    <p class="font-bold text-sm">${i.kegiatan}</p>
                                    <p class="text-[10px] text-slate-400">${formatDate(i.tanggal)} | ${i.waktu}</p>
                                </div>
                                <span class="text-[10px] bg-emerald-600 px-2 py-1 rounded-md">${i.lokasi}</span>
                            </div>
                        `).join('')}
                    </div>

                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="glass-card p-4 text-center">
                            <p class="text-[10px] text-slate-400 uppercase font-bold">Pesanan Pending</p>
                            <p class="text-2xl font-bold text-amber-600">${data.pesanan.filter(p => p.status !== 'Selesai').length}</p>
                        </div>
                        <div class="glass-card p-4 text-center">
                            <p class="text-[10px] text-slate-400 uppercase font-bold">Total Jamaah</p>
                            <p class="text-2xl font-bold text-emerald-600">${data.jamaah.length}</p>
                        </div>
                    </div>
                </div>

                <!-- SIDEBAR DASHBOARD (PESANAN & CATATAN) -->
                <div class="space-y-6">
                    <div class="glass-card p-5">
                        <h4 class="font-bold text-xs mb-4 flex items-center gap-2"><i class="fas fa-bell text-amber-500"></i> PESANAN TERBARU</h4>
                        <div class="space-y-3">
                            ${data.pesanan.slice(0, 3).map(p => `
                                <div class="text-[11px] p-3 bg-slate-50 rounded-lg border-l-4 border-amber-500">
                                    <p class="font-bold">${p.nama_jamaah}</p>
                                    <p class="text-slate-500">${p.item_pesanan}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div class="glass-card p-5">
                        <h4 class="font-bold text-xs mb-4 flex items-center gap-2"><i class="fas fa-pen text-blue-500"></i> CATATAN MEDIS</h4>
                        <div class="space-y-3">
                            ${data.catatan.slice(0, 2).map(c => `
                                <div class="text-[11px] p-3 bg-slate-50 rounded-lg">
                                    <p class="font-bold text-emerald-700">${c.nama_jamaah}</p>
                                    <p class="italic text-slate-500">"${c.diagnosa}"</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // 4. ITINERARY WITH SORT & FILTER
        function renderItinerary(list) {
            // Sorting berdasarkan Tanggal & Waktu
            const sorted = list.sort((a, b) => {
                let dA = new Date(a.tanggal + ' ' + a.waktu);
                let dB = new Date(b.tanggal + ' ' + b.waktu);
                return dA - dB;
            });

            return `
            <div class="glass-card overflow-hidden">
                <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
                    <input type="date" id="filter-date" onchange="filterItineraryByDate()" class="text-xs p-2 rounded-lg border">
                    <span class="text-[10px] font-bold text-slate-400">TOTAL: ${sorted.length} KEGIATAN</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-100 text-[10px] uppercase font-bold text-slate-500">
                            <tr>
                                <th class="p-4">Waktu</th>
                                <th class="p-4">Kegiatan</th>
                                <th class="p-4">Lokasi</th>
                            </tr>
                        </thead>
                        <tbody id="itinerary-body">
                            ${sorted.map(i => `
                                <tr class="border-b hover:bg-slate-50">
                                    <td class="p-4">
                                        <p class="font-bold">${formatTime(i.waktu)}</p>
                                        <p class="text-[10px] text-slate-400">${formatDate(i.tanggal)}</p>
                                    </td>
                                    <td class="p-4 font-semibold text-slate-700">${i.kegiatan}</td>
                                    <td class="p-4"><span class="bg-slate-200 px-2 py-1 rounded text-[10px]">${i.lokasi}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
        }

        // 5. ROOMLIST DENGAN PLOTTING LANGSUNG
        function renderRoomlist(list) {
            return `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                ${list.map(r => `
                    <div class="glass-card p-5 border-t-4 border-emerald-500">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="font-bold text-lg">Kamar ${r.nomor_kamar}</h3>
                            <span class="text-[10px] bg-slate-100 px-2 py-1 rounded font-bold">${r.tipe_kamar}</span>
                        </div>
                        <div class="space-y-2">
                            <div class="text-sm p-2 bg-emerald-50 rounded text-emerald-800 font-bold">${r.nama_jamaah_1 || '-'}</div>
                            <div class="text-sm p-2 bg-emerald-50 rounded text-emerald-800 font-bold">${r.nama_jamaah_2 || '-'}</div>
                            <div class="text-sm p-2 bg-emerald-50 rounded text-emerald-800 font-bold">${r.nama_jamaah_3 || '-'}</div>
                            <div class="text-sm p-2 bg-emerald-50 rounded text-emerald-800 font-bold">${r.nama_jamaah_4 || '-'}</div>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-4 uppercase font-bold">Lokasi: ${r.hotel}</p>
                    </div>
                `).join('')}
            </div>`;
        }

        // 6. MODAL & PLOTTING INPUTS
        function handlePlusButton() {
            const body = document.getElementById('modal-body');
            document.getElementById('modal').classList.remove('hidden');
            
            if (currentPage === 'roomlist') {
                // Dropdown Nama Jamaah dari Cache Data Jamaah
                const jamaahOpts = cacheData.jamaah.map(j => `<option value="${j.nama_lengkap}">${j.nama_lengkap} (Bus ${j.bus})</option>`).join('');
                
                body.innerHTML = `
                <form id="form-data" class="space-y-4">
                    <input type="hidden" name="action" value="insert">
                    <input type="hidden" name="sheet" value="roomlist">
                    <div>
                        <label class="text-xs font-bold text-slate-500">Nomor Kamar</label>
                        <input type="text" name="nomor_kamar" class="w-full p-3 bg-slate-100 rounded-xl mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500">Tipe Kamar</label>
                        <select name="tipe_kamar" class="w-full p-3 bg-slate-100 rounded-xl mt-1">
                            <option>Double</option><option>Triple</option><option>Quad</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-500">Pilih Jamaah (Plotting)</label>
                        <select name="nama_jamaah_1" class="w-full p-3 bg-slate-100 rounded-xl">${jamaahOpts}</select>
                        <select name="nama_jamaah_2" class="w-full p-3 bg-slate-100 rounded-xl"><option value="">- Kosong -</option>${jamaahOpts}</select>
                        <select name="nama_jamaah_3" class="w-full p-3 bg-slate-100 rounded-xl"><option value="">- Kosong -</option>${jamaahOpts}</select>
                        <select name="nama_jamaah_4" class="w-full p-3 bg-slate-100 rounded-xl"><option value="">- Kosong -</option>${jamaahOpts}</select>
                    </div>
                    <button type="button" onclick="submitData()" class="w-full py-4 bg-emerald-600 text-white rounded-2xl font-bold mt-4 shadow-lg">SIMPAN PLOTTING</button>
                </form>`;
            } else {
                // Form Otomatis berdasarkan Page lain
                body.innerHTML = `<p class="text-center text-slate-400">Loading form...</p>`;
                // ... logika form generic lainnya
            }
        }

        async function submitData() {
            const form = document.getElementById('form-data');
            const formData = new FormData(form);
            const plainData = Object.fromEntries(formData.entries());

            document.getElementById('loading-bar').classList.remove('hidden');
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(plainData)
                });
                const result = await res.json();
                if(result.status === 'success') {
                    closeModal();
                    navTo(currentPage);
                }
            } catch (e) {
                alert("Gagal menyimpan!");
            }
        }

        // UTILS
        function formatDate(d) { return new Date(d).toLocaleDateString('id-ID', {day:'2-digit', month:'short'}); }
        function formatTime(t) { 
            if(!t) return '--:--';
            // Menghapus kode panjang jika ada dan hanya ambil HH:mm
            const match = String(t).match(/(\d{2}:\d{2})/);
            return match ? match[1] : t;
        }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('closed'); }

        // Initial Load
        window.onload = () => navTo('dashboard');
    </script>
</body>
</html>
