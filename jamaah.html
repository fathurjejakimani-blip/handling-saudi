<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layanan Kamar - Jejak Imani</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Mulish', sans-serif; }
        .bg-gold-gradient {
            background: linear-gradient(135deg, #064e3b 0%, #042f2e 100%);
        }
        .overlay-bg {
            background-image: url('https://lh3.googleusercontent.com/d/1S04aXsEdKJ1qAKSNnDNwkzQU5drK2MlP');
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            position: absolute;
            inset: 0;
            z-index: 0;
        }
    </style>
</head>
<body class="bg-gold-gradient min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <div class="overlay-bg"></div>

    <div class="bg-white relative z-10 w-full max-w-md rounded-[2.5rem] shadow-2xl p-8 border border-white/20">
        <div class="text-center mb-8">
            <img src="https://lh3.googleusercontent.com/d/1EOlqkwst95ep3vZFoqLj_v_SUV5gNPoD" class="w-20 mx-auto mb-4 drop-shadow-md">
            <h1 class="text-2xl font-extrabold text-green-950 tracking-tight">Layanan Kamar</h1>
            <p class="text-sm text-green-700 font-medium">Haji Khusus 2026 - Jejak Imani</p>
        </div>

        <form id="formPesanan" class="space-y-6">
            <div class="space-y-2">
                <label class="text-[10px] font-extrabold uppercase tracking-widest text-gray-400 ml-2">Nomor Kamar</label>
                <input type="number" id="no_kamar" required placeholder="Contoh: 1205"
                    class="w-full bg-gray-50 border-2 border-gray-100 p-4 rounded-2xl focus:border-green-600 focus:ring-0 outline-none transition-all text-lg font-bold">
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-extrabold uppercase tracking-widest text-gray-400 ml-2">Pilih Kebutuhan</label>
                <select id="nama_barang" required
                    class="w-full bg-gray-50 border-2 border-gray-100 p-4 rounded-2xl focus:border-green-600 outline-none appearance-none font-bold text-gray-700">
                    <option value="">-- Sentuh untuk memilih --</option>
                    <option value="Air Mineral">Air Mineral</option>
                    <option value="Snack Box">Snack Box</option>
                    <option value="Kopi/Teh">Kopi & Teh</option>
                    <option value="Tissue">Tissue</option>
                </select>
            </div>

            <div class="bg-green-50 p-4 rounded-2xl flex items-center justify-between">
                <span class="text-sm font-bold text-green-900">Jumlah</span>
                <div class="flex items-center gap-6">
                    <button type="button" onclick="stepDown()" class="w-10 h-10 bg-white rounded-full shadow-md font-bold text-xl text-green-900">-</button>
                    <input type="number" id="qty" value="1" readonly class="w-8 text-center bg-transparent font-extrabold text-xl">
                    <button type="button" onclick="stepUp()" class="w-10 h-10 bg-white rounded-full shadow-md font-bold text-xl text-green-900">+</button>
                </div>
            </div>

            <button type="submit" id="btnSubmit"
                class="w-full bg-green-900 text-yellow-400 py-5 rounded-2xl font-extrabold text-lg shadow-xl shadow-green-900/40 active:scale-95 transition-all">
                Kirim Pesanan
            </button>
        </form>

        <div id="statusMsg" class="hidden mt-6 p-4 rounded-2xl text-center font-bold animate-bounce"></div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzGhnIqwfiZQTvS4PI63QcQyZ18uLEOZEfp5BECWMkMHsJicuVvg-MOKbCIqrTTG8-w/exec';

        function stepUp() { document.getElementById('qty').value++; }
        function stepDown() { 
            let val = document.getElementById('qty').value;
            if(val > 1) document.getElementById('qty').value--;
        }

        document.getElementById('formPesanan').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const msg = document.getElementById('statusMsg');
            
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            try {
                const params = new URLSearchParams({
                    action: 'addPesanan',
                    no_kamar: document.getElementById('no_kamar').value,
                    nama_barang: document.getElementById('nama_barang').value,
                    qty: document.getElementById('qty').value
                });

                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: params });
                
                msg.innerHTML = "✅ Pesanan Berhasil Terkirim!";
                msg.className = "mt-6 p-4 rounded-2xl bg-green-100 text-green-800 text-center font-bold block";
                document.getElementById('formPesanan').reset();
                document.getElementById('qty').value = 1;
            } catch (err) {
                msg.innerText = "❌ Gagal, coba lagi nanti.";
                msg.className = "mt-6 p-4 rounded-2xl bg-red-100 text-red-800 text-center font-bold block";
            } finally {
                btn.disabled = false;
                btn.innerText = "Kirim Pesanan";
            }
        };
    </script>
</body>
</html>
